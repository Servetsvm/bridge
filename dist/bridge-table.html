<style>
/* Layout: one-screen card table — score strip on top, felt with four compass seats, the player's fanned hand docked at the bottom */
:root{
  --rail:#0c1a14;
  --felt:#1e5c3b;
  --felt-deep:#154629;
  --ink:#f2eee1;
  --muted:#a8c2b0;
  --card:#fffdf6;
  --card-2:#f1ebdb;
  --card-ink:#1b1b1b;
  --red:#c4122f;
  --brass:#d9b25c;
  --brass-ink:#2a2108;
  --vul:#b8322a;
  --panel:#e8eee6;
  --panel-ink:#14281d;
  --sheet:#f6f4ec;
  --sheet-ink:#1d241f;
  --sheet-muted:#5d6a60;
  --pos:#1d6b3c;
  --neg:#b3261e;
  --f-ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-card:"Bitter",Georgia,"Times New Roman",serif;
  --f-face:"Cinzel",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--rail);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
table{color:inherit;font:inherit}
#app{height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;padding-block:8px;gap:8px}
.red{color:var(--red)}

/* header strip */
#bar{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.vulbox{width:52px;height:52px;position:relative;background:var(--panel);color:var(--panel-ink);border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:22px;border:6px solid #f4f4f0;font-variant-numeric:tabular-nums}
.vulbox .dl{position:absolute;font-size:10px;font-weight:700;color:var(--panel-ink)}
.box{background:var(--panel);color:var(--panel-ink);border:0;border-radius:6px;padding:4px 8px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;min-width:64px;line-height:1.1;text-align:left}
button.box{box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.box small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.box b{font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.box .sm{font-size:12px}
.box .tr{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.spacer{flex:1}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{background:#e9e9e4;color:#222;border:0;border-radius:6px;padding:8px 10px;font-weight:600;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.gold{background:var(--brass);color:var(--brass-ink)}
.btn.new{background:#2f6f4a;color:#fff}
.btn.new.warn{background:var(--vul)}

/* table */
#table{flex:1;min-height:0;background:radial-gradient(ellipse at 50% 40%,var(--felt) 0%,var(--felt-deep) 100%);border-radius:14px;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr;gap:6px;padding:8px;position:relative;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
#pos2{grid-column:1/4;grid-row:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
#pos1{max-width:42vw;grid-column:1;grid-row:2;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
#pos3{max-width:42vw;grid-column:3;grid-row:2;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:4px;min-width:0}
#center{grid-column:2;grid-row:2;position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center}
#pos0{display:flex;flex-direction:column;align-items:center;gap:4px}
.lbl{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.28);padding:3px 8px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.lbl .tag{background:var(--brass);color:var(--brass-ink);border-radius:4px;padding:0 4px;font-size:11px}
.lbl.turn{box-shadow:0 0 0 2px var(--brass);background:rgba(217,178,92,.25)}
.lbl .vn{color:#ff9b8f}

/* cards */
.fan{display:flex;justify-content:center;width:100%;padding-top:10px}
.card{--cw:56px;width:var(--cw);height:calc(var(--cw)*1.42);flex:none;margin-left:var(--ov,0px);position:relative;background:linear-gradient(155deg,var(--card) 0%,var(--card) 55%,var(--card-2) 100%);color:var(--card-ink);border-radius:calc(var(--cw)*.1);border:1px solid #c7bea6;box-shadow:-2px 1px 5px rgba(0,0,0,.28);font-family:var(--f-card);user-select:none;overflow:hidden;transition:transform .12s}
.fan .card{--cw:inherit}
.fan{--cw:56px}
.fan .card:first-child{margin-left:0}
.card.rd{color:var(--red)}
.card .ix{position:absolute;top:calc(var(--cw)*.05);left:calc(var(--cw)*.05);width:calc(var(--cw)*.36);display:flex;flex-direction:column;align-items:center;line-height:.92}
.card .ix b{font-size:calc(var(--cw)*.34);font-weight:700;letter-spacing:-.07em}
.card .ix i{font-style:normal;font-size:calc(var(--cw)*.34)}
.card .pip{position:absolute;right:calc(var(--cw)*.08);bottom:calc(var(--cw)*.07);font-size:calc(var(--cw)*.6);line-height:1;display:flex;flex-direction:column;align-items:center}
.card.face .pip{font-size:calc(var(--cw)*.26);border:1.5px solid currentColor;border-radius:calc(var(--cw)*.06);padding:calc(var(--cw)*.05) calc(var(--cw)*.08);background:rgba(217,178,92,.2);right:calc(var(--cw)*.1);bottom:calc(var(--cw)*.1)}
.card.face .pip em{font-style:normal;font-family:var(--f-face);font-weight:700;font-size:calc(var(--cw)*.42);line-height:1}
.card.play{cursor:pointer}
.card.play:hover{transform:translateY(-8px)}
.card.dim{filter:brightness(.6) saturate(.8)}
.card.hint{box-shadow:0 0 0 3px var(--brass);transform:translateY(-10px)}
.vh{display:flex;flex-direction:column;gap:3px}
.vh .row{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.vh .sy{width:14px;font-size:15px;text-align:center}
.mini{display:inline-grid;place-items:center;min-width:23px;height:30px;padding:0 3px;background:linear-gradient(155deg,var(--card),var(--card-2));color:var(--card-ink);border:1px solid #c7bea6;border-radius:4px;font:700 14px var(--f-card);letter-spacing:-.05em}
.mini.rd{color:var(--red)}
.mini.play{cursor:pointer}
.mini.dim{filter:brightness(.6)}
.mini.hint{box-shadow:0 0 0 3px var(--brass)}
.backs{display:flex}
.backs i{width:13px;height:19px;border-radius:2px;background:repeating-linear-gradient(45deg,#7d1626 0 3px,#a3283a 3px 6px);border:1px solid #f1e9d6;margin-left:-6px}
.backs i:first-child{margin-left:0}

/* trick */
.trick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100%,300px);height:min(100%,260px)}
.card.tc{--cw:clamp(44px,12vw,64px);position:absolute;margin:0;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.tc.p0{left:50%;bottom:2%;transform:translateX(-50%)}
.tc.p2{left:50%;top:2%;transform:translateX(-50%)}
.tc.p1{left:4%;top:50%;transform:translateY(-50%)}
.tc.p3{right:4%;top:50%;transform:translateY(-50%)}
.tc.win{box-shadow:0 0 0 3px var(--brass),0 3px 8px rgba(0,0,0,.4)}
.donebox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.donebox b{font-size:18px}

/* auction */
.auction{background:var(--panel);color:var(--panel-ink);border-radius:8px;overflow:auto;min-height:0;flex:0 1 auto;font-size:16px}
.auction table{width:100%;border-collapse:collapse;table-layout:fixed;color:var(--panel-ink)}
.auction th{font-weight:600;padding:4px 2px;background:#fff;color:var(--panel-ink);font-size:14px}
.auction th.v{background:var(--vul);color:#fff}
.auction th.me{text-decoration:underline;text-underline-offset:3px}
.auction td{text-align:center;padding:3px 2px;font-weight:600}
.auction td .c{display:inline-block;padding:1px 6px;border-radius:4px;cursor:pointer}
.auction td .c.cvb{border-bottom:2px dotted #8a6d22}
.auction td .c.sel{background:#d6c38e}
.expl{margin-top:6px;background:#ded7b8;color:#2a2410;border-radius:8px;padding:6px 8px;font-size:14px;min-height:40px;line-height:1.3;max-height:34vh;overflow:auto}
.expl b{font-size:15px}
.expl .cv{margin-top:4px;font-size:13px;color:#4a3f1c}
.expl .cv span{display:inline-block;background:#8a6d22;color:#fff;border-radius:4px;padding:0 5px;margin-right:5px;font-weight:600}

/* bidding box */
#bidbox{display:flex;flex-direction:column;gap:5px}
#bidbox .row{display:flex;gap:4px}
#bidbox button{flex:1;min-width:0;border:0;border-radius:6px;background:#f2f2ee;color:#1e1e1e;font-weight:700;font-size:20px;padding:7px 0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
#bidbox button.sel{background:var(--brass)}
#bidbox button:disabled{opacity:.3;cursor:default}
#bidbox button.pass{background:#a9cc8e}
#bidbox button.dbl{background:#c8102e;color:#fff}
#bidbox button.rdbl{background:#2f5fa8;color:#fff}
#bidbox button.st.r{color:var(--red)}
#status{font-size:14px;color:var(--muted);text-align:center;min-height:18px}

/* overlays */

      add(B(2, 4), h => h.len[lw[0]] >= 5 && h.len[lw[1]] >= 5 && h.hcp >= 7, { min: 7, len: { [lw[0]]: 5, [lw[1]]: 5 }, tag: 'unusual', suits: lw, cv: 'michaels', t: 'Unusual 2NT: ' + SUIT[lw[0]] + ' and ' + SUIT[lw[1]] + ' (5-5)' });
    }
    if (LV(ob) === 1) add(B(1, 4), h => h.bal && h.hcp >= 15 - d && h.hcp <= 18 && h.stop(os), { min: 15 - d, max: 18, len: BAL, t: 'Balanced 15-18 HCP with a stopper in their suit', tag: 'nt1' });
    add('X', h => h.hcp >= 17, { min: 17, cv: 'takeout', t: 'Strong hand: 17+ HCP' });
    for (const s of [3, 2, 1, 0]) {
      if (x.oppSuits.includes(s)) continue; const l = cheap(s);
      if (l + 1 <= 3) add(B(l + 1, s), h => !bal4 && h.len[s] >= 6 && h.hcp >= 5 && h.hcp <= 10 && h.top5(s) >= 2, { min: 5, max: 10, len: { [s]: 6 }, t: 'Weak jump overcall: 6+ ' + SUIT[s] + ', 5-10 HCP' });
    }
    for (const s of [3, 2, 1, 0]) {
      if (x.oppSuits.includes(s)) continue; const l = cheap(s);
      const mn = (l === 1 ? 8 : l === 2 ? 11 : 13) - d;
      add(B(l, s), h => h.len[s] >= (l === 3 ? 6 : 5) && h.hcp >= mn && h.hcp <= 16 && (l === 1 || h.top5(s) >= 2) && h.len[s] >= Math.max(...unbid.map(u => h.len[u])), { min: mn, max: 16, len: { [s]: 5 }, t: 'Overcall: 5+ ' + SUIT[s] + ', ' + mn + '-16 HCP' });
    }
    add('X', h => h.hcp >= 12 - d && h.len[os] <= 2 && unbid.every(u => h.len[u] >= 3 || (h.len[u] >= 2 && h.hcp >= 15)), { min: 12 - d, len: Object.fromEntries(unbid.map(u => [u, 3])), cv: 'takeout', t: 'Takeout double: 12+ HCP, support for the unbid suits' });
    add('P', () => true, { t: 'Pass' });
    return L;
  }

  /* ===== partner opened, my first action ===== */
  if (!oppOpened && opening.seat === p && my.length === 0) {
    const o = opening.call, os = ST(o), ol = LV(o);
    const fresh = opening === pLast && cleanAfter(auc, auc.indexOf(opening));
    if ((o === B(1, 4) || o === B(2, 4)) && rhoPass && fresh) { ntResponses(x, add, ol); return L; }
    if (o === B(1, 4) && opening === pLast && pJust && x.rhoCall === 'X') {
      add('XX', h => h.hcp >= 9, { min: 9, cv: 'runout', t: 'Redouble: 9+ HCP, we have the balance of strength' });
      for (const s of [3, 2, 1, 0]) add(B(2, s), h => h.len[s] >= 5 && h.hcp <= 8 && h.len[s] >= h.len[h.longest], { max: 8, len: { [s]: 5 }, tag: 'run', cv: 'runout', t: 'Escape: 5+ ' + SUIT[s] + ', weak' });

    }

      add(B(3, 4), h => h.hcp >= 10 && !h.stop(obs), { min: 10, cv: 'leb', t: 'Lebensohl fast 3NT: game values, no ' + SUIT[obs] + ' stopper' });
      for (const s of [3, 2, 1, 0]) if (s !== obs) add(B(3, s), h => h.len[s] >= 5 && h.hcp >= 10, { min: 10, len: { [s]: 5 }, cv: 'leb', t: 'Lebensohl: direct three-level bid, 5+ ' + SUIT[s] + ', game forcing', f: 1, gf: 1 });
      for (const s of [3, 2, 1, 0]) if (s !== obs && B(2, s) > ob) add(B(2, s), h => h.len[s] >= 5 && h.hcp <= 9, { max: 9, len: { [s]: 5 }, t: 'Competing: 5+ ' + SUIT[s] + ', to play' });
      add(B(2, 4), h => (h.hcp >= 10 && h.stop(obs)) || (h.hcp <= 8 && h.len[h.longest] >= 6 && h.longest !== obs), { tag: 'leb', os: obs, cv: 'leb', t: 'Lebensohl 2NT: forces opener to bid 3♣', f: 1 });
      add('X', h => h.hcp >= 8, { min: 8, t: 'Double: 8+ HCP, penalty-oriented' });
      add('P', () => true, { t: 'Pass' });

    }
    if (o === B(2, 0) && rhoPass) {
      for (const s of [3, 2]) add(B(2, s), h => h.hcp >= 8 && h.len[s] >= 5 && h.top5(s) >= 2, { min: 8, len: { [s]: 5 }, t: 'Positive: 5+ ' + SUIT[s] + ', 8+ HCP', gf: 1 });
      for (const s of [0, 1]) add(B(3, s), h => h.hcp >= 8 && h.len[s] >= 5 && h.top5(s) >= 2, { min: 8, len: { [s]: 5 }, t: 'Positive: 5+ ' + SUIT[s] + ', 8+ HCP', gf: 1 });
      add(B(2, 4), h => h.hcp >= 8 && h.bal, { min: 8, t: 'Positive: balanced, 8+ HCP', gf: 1 });
      add(B(2, 1), () => true, { max: 7, cv: 'strong2c', t: 'Waiting bid (artificial)', f: 1 });
      return L;
    }
    if (opening.m && opening.m.tag === 'gamb' && rhoPass) {
      add('P', h => [2, 3].every(s => h.stop(s)) && h.aces >= 1, { t: 'Pass: the other suits are stopped' });
      add(B(4, 0), () => true, { tag: 'poc', cv: 'gamb', t: 'Pass or correct: play in your minor' });
      return L;
    }
    if (opening.m && opening.m.tag === 'weak' && rhoPass && C.ogust && ol === 2) add(B(2, 4), h => h.hcp >= 15, { min: 15, tag: 'ogust', cv: 'ogust', t: 'Ogust 2NT: asking about strength and suit quality', f: 1 });
    if (opening.m && (opening.m.tag === 'weak' || opening.m.tag === 'pre') && rhoPass) {
      add(os < 2 ? B(5, os) : B(4, os), h => h.len[os] >= 3 && h.sup(os) >= 16, { min: 14, len: { [os]: 3 }, t: 'Game: support and values' });
      add(B(3, 4), h => h.hcp >= 16 && [0, 1, 2, 3].filter(s => s !== os).every(s => h.stop(s)), { min: 16, t: 'Game: stoppers in every side suit' });
      if (ol === 2) add(B(3, os), h => h.len[os] >= 3 && h.hcp <= 13, { len: { [os]: 3 }, t: 'Preemptive raise' });
      add('P', () => true, { t: 'Pass' });
      return L;
    }
    if (ol === 1 && os < 4) {
      if (fresh || (opening === pLast && pJust && x.rhoCall === 'X')) { suitResponses(x, add, o, os); return L; }
      if (isNum(x.rhoCall) && opening === pLast && pJust) { competitiveResponses(x, add, os); return L; }
    }
  }

  /* ===== advancer: partner overcalled or doubled ===== */
  if (oppOpened && my.length === 0 && pa.length > 0) {
    const pc = pa[pa.length - 1];
    const os = x.oppSuits.length ? x.oppSuits[x.oppSuits.length - 1] : -1;
    const cheap = s => (ST(st.last) < s ? LV(st.last) : LV(st.last) + 1);
    if (pc.call === 'X' && C.respx && isNum(x.rhoCall) && ST(x.rhoCall) === os && os < 4 && LV(x.rhoCall) <= 3) {
      const ub = [0, 1, 2, 3].filter(s => !x.oppSuits.includes(s));
      add('X', h => h.hcp >= 8 && ub.filter(s => h.len[s] >= 4).length >= 2, { min: 8, len: Object.fromEntries(ub.map(s => [s, 3])), cv: 'respx', t: 'Responsive double: 8+ points, both unbid suits' });
    }
    if (pc.call === 'X' && rhoPass && os >= 0) {
      const ub = [3, 2, 1, 0].filter(s => !x.oppSuits.includes(s));
      const best = h => { let b = ub[0]; for (const s of ub) { if (h.len[s] + (s >= 2 ? 0.5 : 0) > h.len[b] + (b >= 2 ? 0.5 : 0)) b = s; } return b; };
      add('P', h => h.len[os] >= 5 && h.top5(os) >= 3 && h.hcp >= 8, { t: 'Penalty pass: strong holding in their suit' });
      for (const s of ub.filter(s => s >= 2)) add(B(4, s), h => best(h) === s && h.len[s] >= 5 && h.hcp >= 12, { min: 12, len: { [s]: 5 }, t: 'Game: 5+ ' + SUIT[s] + ', 12+ HCP' });
      add(B(cheap(os), os), h => h.hcp >= 12, { min: 12, cv: 'cue', t: 'Cue bid: 12+ HCP, forcing', f: 1 });
      add(B(3, 4), h => h.stop(os) && h.hcp >= 13, { min: 13, t: 'Game: 13+ HCP with a stopper' });
      for (const s of ub) { const l = cheap(s) + 1; if (l <= 3) add(B(l, s), h => best(h) === s && h.hcp >= 9 && h.hcp <= 11 && h.len[s] >= 4, { min: 9, max: 11, len: { [s]: 4 }, t: 'Jump: 4+ ' + SUIT[s] + ', 9-11 HCP' }); }
      const nl = cheap(4);
      if (nl <= 2) add(B(nl, 4), h => h.stop(os) && h.hcp >= 6 && h.hcp <= 9 && h.bal, { min: 6, max: 9, t: '6-9 HCP with a stopper' });
      if (nl <= 2) add(B(nl + 1, 4), h => h.stop(os) && h.hcp >= 10 && h.hcp <= 12, { min: 10, max: 12, t: '10-12 HCP with a stopper' });
      for (const s of ub) add(B(cheap(s), s), h => best(h) === s, { max: 8, len: { [s]: 4 }, t: 'Cheapest suit: 4+ ' + SUIT[s] + ', 0-8 HCP' });
      return L;
    }
    if (isNum(pc.call) && pc.call === B(1, 4) && rhoPass) { ntResponses(x, add, 1); return L; }
    if (isNum(pc.call) && ST(pc.call) < 4 && os >= 0 && !x.oppSuits.includes(ST(pc.call))) {
      const ps = ST(pc.call);
      if (ps >= 2) add(B(4, ps), h => h.len[ps] >= 3 && h.sup(ps) >= 14, { min: 12, len: { [ps]: 3 }, t: 'Game: support, 14+ points' });
      if (cheap(os) <= 3) add(B(cheap(os), os), h => h.len[ps] >= 3 && h.sup(ps) >= 11, { min: 11, len: { [ps]: 3 }, cv: 'cue', t: 'Cue bid: support, 11+ points', f: 1 });
      if (cheap(ps) <= 3) add(B(cheap(ps), ps), h => h.len[ps] >= 3 && h.sup(ps) >= 6 && h.sup(ps) <= 10, { min: 6, max: 10, len: { [ps]: 3 }, t: 'Raise: 6-10 points' });
      const nl = cheap(4);
      if (nl <= 2) add(B(nl, 4), h => h.stop(os) && h.hcp >= 8 && h.hcp <= 11, { min: 8, max: 11, t: '8-11 HCP with a stopper' });
      add(B(3, 4), h => h.stop(os) && h.hcp >= 15, { min: 15, t: 'Game: 15+ HCP with a stopper' });
      for (const s of [3, 2, 1, 0]) { if (s === ps || x.oppSuits.includes(s)) continue; const l = cheap(s); if (l > 3) continue; add(B(l, s), h => h.len[s] >= 5 && h.hcp >= 8 && h.len[ps] <= 2, { min: 8, len: { [s]: 5 }, t: 'Natural: 5+ ' + SUIT[s] + ', 8+ HCP' }); }
      add('P', h => h.hcp <= 11, { t: 'Pass' });
      return L;
    }
  }

  /* ===== opener's rebid ===== */
  if (!oppOpened && opening.seat === x.seat && my.length === 1 && pa.length === 1 && isNum(pa[0].call)) {
    const tail = auc.slice(auc.indexOf(opening) + 1);
    if (tail.length === 3 && tail[0].call === 'P' && tail[2].call === 'P') { if (openerRebid(x, add, opening.call, pa[0])) return L; }
  }

  /* ===== responder's second bid: New Minor Forcing, Fourth Suit Forcing ===== */
  if (!oppOpened && opening.seat === p && my.length === 1 && pa.length === 2 && isNum(my[0].call) && isNum(pa[1].call) && ourOnly(x) && LV(opening.call) === 1 && ST(opening.call) < 4) {
    const os = ST(opening.call), ms = ST(my[0].call), r2 = pa[1].call, r2s = ST(r2);
    if (C.nmf && os < 2 && LV(my[0].call) === 1 && ms >= 2 && r2 === B(1, 4)) {
      const nm = os === 0 ? 1 : 0, om = otherMajor(ms);
      add(B(2, nm), h => h.hcp >= 11 && (h.len[ms] >= 5 || h.len[om] >= 4), { min: 11, tag: 'nmf', ms, cv: 'nmf', t: 'New Minor Forcing: asking for 3-card ' + SUIT[ms] + ' support or four ' + SUIT[om], f: 1 });
    }
    if (C.fsf && r2s < 4 && r2s !== os && r2s !== ms && ms < 4) {

      const lvl = ST(r2) < fourth ? LV(r2) : LV(r2) + 1;
      if (lvl <= 3) add(B(lvl, fourth), h => h.hcp >= 12 && h.len[r2s] < 4 && h.len[os] < 3 && h.len[ms] < 6 && !h.stop(fourth), { min: 12, tag: 'fsf', cv: 'fsf', t: 'Fourth suit forcing: game values, asking opener to describe', f: 1, gf: 1 });
    }
  }

    const ms = pm.ms, om = otherMajor(ms);
    add(B(2, ms), h => h.len[ms] >= 3, { len: { [ms]: 3 }, cv: 'nmf', t: 'New Minor Forcing reply: three-card ' + SUIT[ms] + ' support' });
    if (B(2, om) > pLast.call) add(B(2, om), h => h.len[om] >= 4, { len: { [om]: 4 }, cv: 'nmf', t: 'New Minor Forcing reply: four ' + SUIT[om] });
    add(B(2, 4), h => h.hcp <= 13, { max: 13, cv: 'nmf', t: 'New Minor Forcing reply: no fit, minimum' });
    add(B(3, 4), () => true, { min: 14, cv: 'nmf', t: 'New Minor Forcing reply: no fit, maximum' });
    return L;
  }
  /* ===== support double ===== */
  if (!oppOpened && C.supx && opening.seat === x.seat && my.length === 1 && pa.length === 1 && isNum(pa[0].call) && LV(pa[0].call) === 1 && ST(pa[0].call) >= 2 && isNum(x.rhoCall) && ST(x.rhoCall) < 4 && pJust && x.rhoCall < B(2, ST(pa[0].call))) {
    const M = ST(pa[0].call);

    add(B(2, M), h => h.len[M] >= 4 && h.sup(M) <= 15, { len: { [M]: 4 }, t: 'Raise: four-card support' });
    return L;
  }

  /* ===== notrump follow-ups (Stayman, transfers, Smolen) ===== */
  if (!oppOpened && (opening.call === B(1, 4) || opening.call === B(2, 4)) && ourOnly(x)) {
    const lv = LV(opening.call);
    if (opening.seat === p && my.length === 1 && pa.length === 2 && (mm.tag === 'stay' || mm.tag === 'tr')) {
      const ans = pa[1].call;
      if (mm.tag === 'stay') {
        const aS = ST(ans);
        if (aS === 2 || aS === 3) {
          add(B(4, aS), h => h.len[aS] >= 4 && (lv === 2 || h.hcp >= 10) && h.hcp <= 15, { min: lv === 1 ? 10 : 4, len: { [aS]: 4 }, t: 'Major fit: game' });
          if (lv === 1) add(B(3, aS), h => h.len[aS] >= 4 && h.hcp >= 8 && h.hcp <= 9, { min: 8, max: 9, len: { [aS]: 4 }, t: 'Major fit: invitational' });
        }
        if (aS === 1 && C.smolen && lv === 1) {
          add(B(3, 2), h => h.len[2] === 4 && h.len[3] >= 5 && h.hcp >= 10, { min: 10, len: { 2: 4, 3: 5 }, tag: 'smolen', five: 3, cv: 'smolen', t: 'Smolen: 4♥ + 5♠, game forcing', f: 1, gf: 1 });
          add(B(3, 3), h => h.len[3] === 4 && h.len[2] >= 5 && h.hcp >= 10, { min: 10, len: { 3: 4, 2: 5 }, tag: 'smolen', five: 2, cv: 'smolen', t: 'Smolen: 4♠ + 5♥, game forcing', f: 1, gf: 1 });
        }
        if (aS === 2 && lv === 1) add(B(2, 3), h => h.len[3] >= 4 && h.hcp >= 8 && h.hcp <= 9, { min: 8, max: 9, len: { 3: 4 }, t: 'Four spades, invitational' });
        if (lv === 1) add(B(2, 4), h => h.hcp <= 9, { min: 8, max: 9, t: 'Invitational: 8-9 HCP' });
        add(B(3, 4), h => h.hcp <= 15, { min: lv === 1 ? 10 : 4, max: 15, t: 'Game' });
      } else {
        const M = ST(ans);
        if (lv === 1) {
          add('P', h => h.hcp <= 7, { max: 7, t: 'Weak: play the transfer suit' });
          add(B(3, M), h => h.len[M] >= 6 && h.hcp <= 9, { min: 8, max: 9, len: { [M]: 6 }, t: 'Six-card suit, invitational' });
          add(B(4, M), h => h.len[M] >= 6 && h.hcp <= 15, { min: 10, max: 15, len: { [M]: 6 }, t: 'Six-card suit, game' });
          add(B(2, 4), h => h.hcp <= 9, { min: 8, max: 9, len: { [M]: 5 }, t: 'Five-card major, invitational' });
          add(B(3, 4), h => h.hcp <= 15, { min: 10, max: 15, len: { [M]: 5 }, t: 'Five-card major, game: opener chooses' });
        } else {
          add('P', h => h.hcp <= 3, { max: 3, t: 'Weak' });
          add(B(4, M), h => h.len[M] >= 6 && h.hcp <= 12, { len: { [M]: 6 }, t: 'Six-card suit, game' });
          add(B(3, 4), h => h.hcp <= 12, { len: { [M]: 5 }, t: 'Five-card major, game: opener chooses' });

      add(B(3, 4), () => true, { t: 'Smolen reply: no fit, 3NT' });

    }
    if (opening.seat === x.seat && my.length === 2 && my[1].m && my[1].m.tag === 'trc' && pa.length === 2 && ST(my[1].call) >= 2) {
      const M = ST(my[1].call), r2 = pa[1].call;
      if (r2 === B(2, 4)) { add(B(4, M), h => h.len[M] >= 3 && h.hcp >= 16, { t: 'Fit and maximum: game' }); add(B(3, M), h => h.len[M] >= 3, { t: 'Fit, minimum' }); add(B(3, 4), h => h.hcp >= 16, { t: 'Maximum, no fit' }); add('P', () => true, { t: 'Minimum' }); return L; }
      if (r2 === B(3, 4)) { add(B(4, M), h => h.len[M] >= 3, { t: 'Three-card fit: major game' }); add('P', () => true, { t: 'No fit' }); return L; }
      if (r2 === B(3, M)) { add(B(4, M), h => lv === 2 || h.hcp >= 16 || h.len[M] >= 4, { t: 'Accepting the invitation' }); add('P', () => true, { t: 'Minimum' }); return L; }
      if (r2 >= B(4, 0)) { add('P', () => true, { t: 'Pass' }); return L; }
    }
    if (opening.seat === p && my.length === 1 && pa.length === 2 && mm.tag === 'trm') { add('P', () => true, { t: 'Pass to play the minor' }); return L; }
  }
  return L;
}

/* ---- responses to 1NT / 2NT (also after our 1NT overcall) ---- */
function ntResponses(x, add, lv) {

  add(B(2 + off, 1), h => h.len[2] >= 5 && h.len[2] >= h.len[3], { len: { 2: 5 }, tag: 'tr', cv: 'jtr', t: 'Transfer: 5+ ♥ (opener bids hearts)', f: 1 });
  add(B(2 + off, 2), h => h.len[3] >= 5, { len: { 3: 5 }, tag: 'tr', cv: 'jtr', t: 'Transfer: 5+ ♠ (opener bids spades)', f: 1 });
  if (C.stayman) add(B(2 + off, 0), h => h.hcp >= (lv === 1 ? 8 : 4) && (h.len[2] === 4 || h.len[3] === 4) && h.pat !== '4333', { min: lv === 1 ? 8 : 4, tag: 'stay', cv: 'stayman', t: 'Stayman: asking for a 4-card major', f: 1 });
  if (lv === 1) {
    if (C.fourWay) {
      add(B(2, 3), h => h.len[0] >= 6 && h.hcp <= 7, { max: 7, len: { 0: 6 }, tag: 'trm', to: B(3, 0), cv: 'fourWay', t: '4-way transfer: 6+ ♣ (opener bids 3♣)' });
      add(B(2, 4), h => h.len[1] >= 6 && h.hcp <= 7, { max: 7, len: { 1: 6 }, tag: 'trm', to: B(3, 1), cv: 'fourWay', t: '4-way transfer: 6+ ♦ (opener bids 3♦)' });
      if (C.stayman) add(B(2, 0), h => h.hcp >= 8 && h.hcp <= 9, { min: 8, tag: 'stay', cv: 'stayman', t: 'Stayman (may be a balanced invitation)', f: 1 });
    } else add(B(2, 4), h => h.hcp >= 8 && h.hcp <= 9, { min: 8, max: 9, t: 'Invitational: 8-9 HCP' });
    add(B(3, 4), h => h.hcp >= 10 && h.hcp <= 15, { min: 10, max: 15, t: 'Game: 10-15 HCP' });
    add(B(4, 4), h => h.hcp >= 16 && h.hcp <= 17, { min: 16, max: 17, tag: 'q', cv: 'q', t: 'Quantitative 4NT: slam invitation, 16-17 HCP' });
    add(B(6, 4), h => h.hcp >= 18 && h.hcp <= 19, { min: 18, max: 19, t: 'Small slam' });

      add(B(3, os), h => h.len[os] >= 5 && h.hcp <= 9 && h.len[2] < 4 && h.len[3] < 4, { max: 9, len: { [os]: 5 }, cv: "invMin", t: "Inverted minor: preemptive raise, 0-9 points, 5+ support" });
    }

/* ---- responses after RHO overcalls partner's one-suit opening ---- */
function competitiveResponses(x, add, os) {
  const ob = x.rhoCall, obs = ST(ob), maj = os >= 2;
  const cheap = s => (ST(ob) < s ? LV(ob) : LV(ob) + 1);
  const cl = cheap(os), need = maj ? 3 : 4;
  if (obs < 4 && cl + 1 <= 4) add(B(cheap(obs), obs), h => h.len[os] >= need && h.sup(os) >= 11, { min: 11, len: { [os]: need }, cv: 'cue', t: 'Cue bid: support, limit raise or better', f: 1 });
  if (cl <= 3) add(B(cl, os), h => h.len[os] >= need && h.sup(os) >= 6 && h.sup(os) <= 10, { min: 6, max: 10, len: { [os]: need }, t: 'Raise: 6-10 points' });
  if (LV(ob) <= 2 && obs < 4) {
    const um = [2, 3].filter(s => s !== os && s !== obs);
    if (um.length) add('X', h => h.hcp >= (LV(ob) === 1 ? 6 : 8) && um.some(s => h.len[s] >= 4), { min: 6, len: Object.fromEntries(um.map(s => [s, 4])), cv: 'nego', t: 'Negative double: four cards in the unbid major' });
  }
  for (const s of [3, 2, 1, 0]) { if (s === os || s === obs) continue; const l = cheap(s); if (l > 3) continue; add(B(l, s), h => h.len[s] >= 5 && h.hcp >= (l === 1 ? 6 : 10), { min: l === 1 ? 6 : 10, len: { [s]: 5 }, t: 'Natural: 5+ ' + SUIT[s] + ', ' + (l === 1 ? 6 : 10) + '+ HCP', f: 1 }); }
  if (obs < 4) {
    const nl = cheap(4);
    if (nl === 1) add(B(1, 4), h => h.stop(obs) && h.hcp >= 8 && h.hcp <= 10, { min: 8, max: 10, t: '8-10 HCP with a stopper in their suit' });
    if (nl <= 2) add(B(2, 4), h => h.stop(obs) && h.hcp >= 11 && h.hcp <= 12, { min: 11, max: 12, t: '11-12 HCP with a stopper' });
    add(B(3, 4), h => h.stop(obs) && h.hcp >= 13 && h.hcp <= 16, { min: 13, max: 16, t: 'Game: 13-16 HCP with a stopper' });
  }
  add('P', h => h.hcp <= 9, { t: 'Pass' });
}

/* ---- opener's second bid, uncontested ---- */
function openerRebid(x, add, o, resp) {
  const os = ST(o), ol = LV(o), r = resp.call, rs = ST(r), rl = LV(r), rm = resp.m || {};
  if (os === 4 && (ol === 1 || ol === 2)) {
    const off = ol - 1;
    if (rm.tag === 'stay') {
      add(B(2 + off, 2), h => h.len[2] >= 4, { len: { 2: 4 }, cv: 'stayman', t: 'Stayman reply: four hearts' });
      add(B(2 + off, 3), h => h.len[3] >= 4, { len: { 3: 4 }, cv: 'stayman', t: 'Stayman reply: four spades, not four hearts' });
      add(B(2 + off, 1), () => true, { cv: 'stayman', t: 'Stayman reply: no 4-card major' });
      return true;
    }
    if (rm.tag === 'tr') { const M = r === B(2 + off, 1) ? 2 : 3; add(B(2 + off, M), () => true, { tag: 'trc', cv: 'jtr', t: 'Completing the transfer to ' + SUIT[M] }); return true; }
    if (rm.tag === 'q') { add(B(6, 4), h => h.hcp >= (ol === 1 ? 17 : 21), { t: 'Accepting the invitation' }); add('P', () => true, { t: 'Minimum: declining' }); return true; }
    if (r === B(2, 4) && ol === 1 && !rm.tag) { add(B(3, 4), h => h.hcp >= 16, { min: 16, t: 'Maximum: accepting the invitation' }); add('P', () => true, { max: 15, t: 'Minimum' }); return true; }
    if (r === B(3, 4) || (r >= B(4, 3) && !rm.tag)) { add('P', () => true, { t: 'Pass' }); return true; }
    return false;
  }
  if (o === B(2, 0) && r === B(2, 1)) {
    add(B(2, 4), h => h.bal && h.hcp <= 24, { min: 22, max: 24, t: 'Balanced 22-24 HCP' });
    add(B(3, 4), h => h.bal && h.hcp >= 25, { min: 25, max: 27, t: 'Balanced 25-27 HCP' });
    for (const s of [3, 2]) add(B(2, s), h => h.longest === s || (h.len[s] >= 5 && h.len[s] >= h.len[h.longest]), { min: 22, len: { [s]: 5 }, t: '5+ ' + SUIT[s] + ', game forcing', f: 1, gf: 1 });
    for (const s of [0, 1]) add(B(3, s), h => h.longest === s, { min: 22, len: { [s]: 5 }, t: '5+ ' + SUIT[s] + ', game forcing', f: 1, gf: 1 });
    return true;
  }
  if (ol !== 1 || os === 4) return false;
  if (rm.tag === 'wjs') { add('P', () => true, { t: 'Passing partner\'s weak suit' }); return true; }
  if (rm.tag === 'inv') {
    add(B(3, 4), h => h.bal && h.hcp >= 18, { min: 18, max: 19, cv: 'invMin', t: 'After the inverted raise: balanced 18-19' });
    add(B(2, 4), h => h.bal && h.hcp <= 14, { min: 12, max: 14, cv: 'invMin', t: 'After the inverted raise: balanced minimum' });
    for (let s = 1; s <= 3; s++) if (s !== os && B(2, s) > r) add(B(2, s), h => h.stop(s) && h.hcp >= 15, { min: 15, t: 'Stopper in ' + SUIT[s] + ', extra values', f: 1 });
    add(B(3, os), () => true, { max: 14, t: 'Minimum, unbalanced' });
    return true;
  }
  if (rm.tag === 'drury') {
    add(B(4, os), h => h.hcp >= 14, { min: 14, cv: 'drury', t: 'Drury reply: full opening, game' });
    add(B(2, os), () => true, { max: 13, cv: 'drury', t: 'Drury reply: light opening, no game' });
    return true;
  }
  if (rm.tag === 'j2nt') {
    add(B(4, os), h => h.hcp <= 14, { min: 12, max: 14, cv: 'j2nt', t: 'Jacoby 2NT reply: minimum, stop in game' });
    add(B(3, os), () => true, { min: 15, cv: 'j2nt', t: 'Jacoby 2NT reply: extras, slam interest', f: 1 });
    return true;
  }
  if (rm.tag === 'bergen7') { add(B(4, os), h => h.sup(os) >= 16, { min: 15, t: 'After Bergen: game' }); add(B(3, os), () => true, { max: 15, cv: 'bergen', t: 'After Bergen: minimum, stop at the three level' }); return true; }
  if (rm.tag === 'bergen10') { add(B(4, os), h => h.sup(os) >= 14, { min: 14, t: 'Accepting the limit raise: game' }); add(B(3, os), () => true, { max: 13, cv: 'bergen', t: 'Minimum: stop at the three level' }); return true; }
  if (rm.tag === 'bergenP') { add(B(4, os), h => h.sup(os) >= 18, { min: 17, t: 'Strong hand: game' }); add('P', () => true, { t: 'Pass' }); return true; }
  if (rs === os && rl === 2) {
    if (os >= 2) add(B(4, os), h => h.sup(os) >= 19, { min: 18, t: 'Game: 19+ points' });
    else add(B(3, 4), h => h.hcp >= 18 && h.semi, { min: 18, t: 'Game: balanced, 18+ HCP' });
    add(B(3, os), h => h.sup(os) >= 16, { min: 15, max: 18, t: 'Game invitation: 16-18 points' });
    add('P', () => true, { max: 15, t: 'Minimum hand' });
    return true;
  }
  if (rs === os && rl === 3) {
    if (os >= 2) add(B(4, os), h => h.sup(os) >= 14, { min: 14, t: 'Accepting: game' });
    else { add(B(3, 4), h => h.hcp >= 14 && h.semi, { min: 14, t: 'Accepting: 3NT' }); add(B(5, os), h => h.tp >= 17, { min: 15, t: 'Accepting: minor-suit game' }); }
    add('P', () => true, { max: 13, t: 'Minimum: declining' });
    return true;
  }
  if (rm.tag === 'splinter') return false;
  if ((rl >= 3 && rs === os) || r === B(3, 4) || r === B(4, os)) { add('P', () => true, { t: 'Pass' }); return true; }
  if (rl === 1 && rs < 4) {
    if (rs >= 2) {
      add(B(4, rs), h => h.len[rs] >= 4 && h.sup(rs) >= 19, { min: 18, len: { [rs]: 4 }, t: 'Four-card support, game: 19+ points' });
      add(B(3, rs), h => h.len[rs] >= 4 && h.sup(rs) >= 16, { min: 16, max: 18, len: { [rs]: 4 }, t: 'Jump raise: 16-18 points' });
      add(B(2, rs), h => h.len[rs] >= 4, { min: 12, max: 15, len: { [rs]: 4 }, t: 'Four-card support: 12-15 points' });
    }
    for (let s = rs + 1; s <= 3; s++) if (s !== os) add(B(1, s), h => h.len[s] >= 4, { min: 11, max: 18, len: { [s]: 4 }, t: '4+ ' + SUIT[s] + ', 12-18 HCP' });
    add(B(1, 4), h => h.bal && h.hcp <= 14, { min: 12, max: 14, t: 'Balanced, 12-14 HCP' });
    add(B(2, 4), h => h.bal && h.hcp >= 18, { min: 18, max: 19, t: 'Balanced, 18-19 HCP' });
    add(B(3, os), h => h.len[os] >= 6 && h.tp >= 16, { min: 16, max: 18, len: { [os]: 6 }, t: '6+ ' + SUIT[os] + ', 16-18 points' });
    if (rs === 1 && os === 0) add(B(2, 1), h => h.len[1] >= 4 && h.sup(1) <= 15, { len: { 1: 4 }, t: 'Four-card support' });
    add(B(2, os), h => h.len[os] >= 6, { min: 11, max: 15, len: { [os]: 6 }, t: '6+ ' + SUIT[os] + ', minimum' });
    for (let s = 0; s < os; s++) if (s !== rs) add(B(2, s), h => h.len[s] >= 4 && h.hcp <= 18, { min: 11, max: 18, len: { [s]: 4 }, t: 'Second suit: 4+ ' + SUIT[s] });
    for (let s = os + 1; s <= 3; s++) if (s !== rs && B(2, s) > r) add(B(2, s), h => h.len[s] >= 4 && h.hcp >= 17, { min: 17, len: { [s]: 4 }, t: 'Reverse: 4+ ' + SUIT[s] + ', 17+ HCP', f: 1 });
    add(B(2, os), h => h.len[os] >= 5, { min: 11, max: 15, len: { [os]: 5 }, t: '5+ ' + SUIT[os] + ', minimum' });
    add(B(1, 4), h => h.hcp <= 15, { max: 15, t: 'Minimum hand' });
    return true;
  }
  if (r === B(1, 4)) {
    const forcing = rm.tag === 'nt1f';
    add(B(2, 4), h => h.bal && h.hcp >= 18, { min: 18, max: 19, t: 'Balanced 18-19, invitational' });
    add(B(3, os), h => h.len[os] >= 6 && h.tp >= 16, { min: 16, len: { [os]: 6 }, t: '6+ ' + SUIT[os] + ', invitational' });
    add(B(2, os), h => h.len[os] >= 6, { len: { [os]: 6 }, t: '6+ ' + SUIT[os] });
    for (let s = 0; s < os; s++) add(B(2, s), h => h.len[s] >= 4 && h.hcp <= 18, { min: 11, max: 18, len: { [s]: 4 }, t: 'Second suit: 4+ ' + SUIT[s] });
    for (let s = os + 1; s <= 3; s++) add(B(2, s), h => h.len[s] >= 4 && h.hcp >= 17, { min: 17, len: { [s]: 4 }, t: 'Reverse: 17+ HCP', f: 1 });
    if (forcing) {
      for (const s of [0, 1]) if (s !== os) add(B(2, s), h => h.len[s] >= 3, { min: 11, max: 15, len: { [s]: 3 }, cv: 'twoOverOne', t: 'Reply to forcing 1NT: three-card ' + SUIT[s] });
      add(B(2, os), () => true, { len: { [os]: 5 }, t: 'Five ' + SUIT[os] + ', minimum' });
    } else add('P', () => true, { max: 15, t: 'Minimum: pass' });
    return true;
  }
  if (rl === 2 && rs < 4 && rs !== os) {
    add(B(3, rs), h => h.len[rs] >= (rs >= 2 ? 3 : 4), { len: { [rs]: 3 }, t: 'Support for ' + SUIT[rs] });
    add(B(2, os), h => h.len[os] >= 6 && B(2, os) > r, { len: { [os]: 6 }, t: '6+ ' + SUIT[os] });
    for (let s = 0; s <= 3; s++) if (s !== os && s !== rs && B(2, s) > r) add(B(2, s), h => h.len[s] >= 4, { len: { [s]: 4 }, t: '4+ ' + SUIT[s] });
    add(B(2, 4), h => h.semi, { t: 'Balanced hand' });
    if (B(2, os) > r) add(B(2, os), () => true, { len: { [os]: 5 }, t: '5+ ' + SUIT[os] });
    add(B(3, os), h => h.len[os] >= 6, { len: { [os]: 6 }, t: '6+ ' + SUIT[os] });
    return true;

}

function partnerForcing(x) {
  const i = x.auc.length - 2; if (i < 0) return false; const e = x.auc[i];
  return e.seat === x.p && e.call !== 'P' && e.m && e.m.f && x.rhoCall === 'P';
}

/* ---- general judgement when no specific rule applies ---- */
function generic(x, h) {
  const P = pInfo(x), st = x.st, last = st.last, me = x.seat;
  const forced = partnerForcing(x);
  const gf = x.auc.some(e => sideOf(e.seat) === sideOf(me) && e.m && e.m.gf);
  let majorFit = -1, minorFit = -1, mfl = 0, nfl = 0;
  for (const s of [3, 2]) { const t = h.len[s] + P.len[s]; if (t >= 8 && t > mfl) { majorFit = s; mfl = t; } }
  for (const s of [1, 0]) { const t = h.len[s] + P.len[s]; if (t >= 8 && t > nfl) { minorFit = s; nfl = t; } }
  const oppStops = x.oppSuits.every(s => h.stop(s));
  const pBidNT = x.pa.some(e => isNum(e.call) && ST(e.call) === 4);
  let t;
  if (majorFit >= 0) t = majorFit;
  else if ((pBidNT && oppStops) || ((h.bal || h.semi) && oppStops && minorFit < 0)) t = 4;
  else if (minorFit >= 0) t = minorFit;
  else {

const Field = {

      const src = 'const E={};\n' + window.BRIDGE.map(f => '(' + f.toString() + ')(E);').join('\n') + '\n(' + E.workerMain.toString() + ')(E);';
      this.worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      this.worker.onmessage = e => this.onmsg(e.data);
      this.worker.onerror = () => { this.worker = null; };
    } catch (e) { this.worker = null; }
  },
  start(g) {
    const f = { tables: [], done: false, dd: {}, normC: null };
    g.field = f; this.live[g.id] = { f, deal: g.deal, board: g.board };
    const msg = { type: 'field', id: g.id, deal: g.deal, board: g.board, cards: g.cards, n: 8 };
    if (this.worker) this.worker.postMessage(msg); else this.fallback(msg);
  },
  dd(id, key, deal, c) {
    const msg = { type: 'dd', id, key, deal, c };
    if (this.worker) this.worker.postMessage(msg);

  },
  fallback(msg) {
    let i = 0;

      if (i >= msg.n) { this.onmsg({ type: 'fieldDone', id: msg.id }); return; }
      const r = E.simulateTable(msg.deal, msg.board, msg.cards, E.FIELD_AGG[i]);
      this.onmsg({ type: 'table', id: msg.id, i, r }); i++; setTimeout(step, 30);

    setTimeout(step, 500);
  },
  onmsg(m) {
    const L = this.live[m.id]; if (!L) return; const f = L.f;
    if (m.type === 'table') f.tables.push(m.r);
    if (m.type === 'fieldDone') {
      f.done = true;
      const cnt = {}; let best = null;
      for (const t of f.tables) { if (t.passed) continue; const k = conId(t.c); cnt[k] = (cnt[k] || 0) + 1; if (!best || cnt[k] > cnt[conId(best)]) best = t.c; }
      f.normC = best;
      if (best) this.dd(m.id, 'norm', L.deal, best);
      const e = HIST.find(h => h.id === m.id);
      if (e) { applyField(e, f); Store.saveRec(e); scheduleSync(); }
    }
    if (m.type === 'dd') { f.dd[m.key] = m.t; const e = HIST.find(h => h.id === m.id); if (e) e.dd = { ...f.dd }; }
    if (m.type === 'error') f.done = true;

  },
};
function applyField(e, f) {
  if (!f || !f.done || !f.tables.length) return;
  const fus = f.tables.map(t => sideOf(e.seat) === 0 ? t.ns : -t.ns);
  const cmp = E.compare(e.us, fus); e.imp = cmp.imp; e.mp = cmp.mp;

}

/* a never-seen deal; in practice mode, one where our side gets to use the chosen convention */
function freshDeal(dealer) {
  const want = SET.practice, cards = sideCards(), t0 = performance.now();
  let fallback = null;
  for (let i = 0; i < 20000; i++) {
    const d = E.shuffle([...Array(52).keys()]);
    const deal = [0, 1, 2, 3].map(k => d.slice(k * 13, k * 13 + 13));
    const key = E.dealKey(deal);
    if (SEEN.has(key)) continue;
    if (want) {
      const auc = [];
      while (!auctionOver(auc) && auc.length < 60) { const t = (dealer + auc.length) % 4; const r = E.aiBid(auc, t, deal[t], cards); auc.push({ seat: t, call: r.call, m: r.m }); }
      const mine = auc.some(e => e.seat === U() && e.m && e.m.cv === want);
      const ours = auc.some(e => sideOf(e.seat) === sideOf(U()) && e.m && e.m.cv === want);
      if (!mine && !ours) { if (performance.now() - t0 < 4000) continue; }
      else if (!mine) { if (!fallback) fallback = { deal, key }; if (performance.now() - t0 < 2500) continue; }
      if (!mine && !ours && fallback) { SEEN.add(fallback.key); saveSeen(); return fallback.deal; }
      if (!mine && !ours) flash('No practice deal found quickly — here is a normal deal', 2500);
    }
    SEEN.add(key); saveSeen(); return deal;
  }

}

  const ddTxt = (k, c) => { const v = f.dd[k]; if (v === undefined) return 'calculating…'; if (v === null) return 'not available'; const d = v - (c.level + 6); return `${v} tricks (${d >= 0 ? 'makes' : 'down ' + -d})`; };
  let fieldHtml;
  if (!f.done) fieldHtml = `<div class="muted">The robot tables are playing this deal… (${f.tables.length}/8)</div>`;
  else {
    const fus = t => sideOf(e.seat) === 0 ? t.ns : -t.ns;
    fieldHtml = `<table class="res"><thead><tr><th>Table</th><th>Contract</th><th>Tricks</th><th class="n">Score</th><th class="n">IMP</th></tr></thead><tbody>${f.tables.map((t, i) => `<tr><td>${i + 1}</td><td>${t.passed ? 'Pass' : conKey(t.c)}</td><td>${t.tricks ?? ''}</td><td class="n">${fmtSigned(fus(t))}</td><td class="n">${fmtSigned(E.imps(e.us - fus(t)))}</td></tr>`).join('')}</tbody></table>`;
  }
  const scoreTxt = e.imp != null ? `<div class="score2"><div class="${SET.mode === 'IMP' ? 'on' : ''}"><small>IMP</small><b>${fmtSigned(e.imp)}</b></div><div class="${SET.mode === 'MP' ? 'on' : ''}"><small>MP</small><b>${e.mp}%</b></div></div>` : '';
  const norm = f.normC;
  openOv('end', `<h2>Board ${e.board}</h2><div class="big">${resultLine(e)}</div>${G.claimed ? '<div class="muted">The remaining tricks were settled by claim.</div>' : ''}
   ${scoreTxt}
   <div class="grp"><span>Par check</span><div>Normal contract (most common at the robot tables): ${f.done ? (norm ? conKey(norm) + ' — double dummy ' + ddTxt('norm', norm) : 'Pass') : '…'}</div>
   ${e.c ? `<div>Your contract ${conKey(e.c)} — double dummy ${ddTxt('you', e.c)}</div>` : ''}</div>
   <div class="grp"><span>Robot tables</span>${fieldHtml}</div>
   ${dealHtml(G.deal, U())}
   <div class="row2"><button class="btn gold" id="oNext">Next deal</button><button class="btn" id="oReplay">Replay this deal</button><button class="btn" id="oClose">Close</button></div>`);
}
function showAuction() {
  if (!G.auction.length) return;
  openOv('auc', `<h2>Auction</h2><div class="auction">${auctionTable(G.auction, false)}</div><div class="expl">${explHtml(ui.lastExpl != null ? G.auction[ui.lastExpl] : null)}</div><div class="row2"><button class="btn gold" id="oClose">Close</button></div>`);
}
function showSettings() {
  const seg = (name, opts, cur) => `<div class="seg" data-seg="${name}">${opts.map(([v, l]) => `<button data-v="${v}" class="${String(cur) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const convs = E.CONVS.map(c => `<label class="cvrow"><input type="checkbox" data-conv="${c.k}" ${SET.conv[c.k] ? 'checked' : ''}><span><b>${c.n}</b>${c.x ? `<em class="xo">replaces ${E.CONVS.find(y => y.k === c.x).n}</em>` : ''}<small>${symText(c.d)}</small></span></label>`).join('');
  openOv('set', `<h2>Settings</h2>
   <div class="grp"><span>Practice a convention</span><select id="sPractice" class="sel"><option value="">Off — normal random deals</option>${E.CONVS.map(c => `<option value="${c.k}" ${SET.practice === c.k ? 'selected' : ''}>${c.n}</option>`).join('')}</select><div class="muted">New deals are chosen so that you (or your partner) get to use this convention. It is switched on in your card automatically.</div></div>
   <div class="grp"><span>Play a specific deal</span><button class="btn" id="sDeal">Enter a deal (from a photo or a hand record)</button></div>
   <div class="grp"><span>Your seat</span>${seg('seat', [[0, 'North'], [1, 'East'], [2, 'South'], [3, 'West']], SET.seat)}</div>
   <div class="grp"><span>Scoring</span>${seg('mode', [['IMP', 'IMP'], ['MP', 'Matchpoints (%)']], SET.mode)}</div>
   <div class="grp"><span>Opponents' system</span>${seg('opp', [['same', 'Same as ours'], ['sayc', 'Standard (SAYC)']], SET.opp)}</div>
   <div class="grp"><span>Robot speed</span>${seg('speed', [[0, 'Slow'], [1, 'Normal'], [2, 'Fast']], SET.speed)}</div>
   <div class="grp"><span>Bid explanations</span>${seg('expl', [[1, 'Show'], [0, 'Hide']], SET.expl ? 1 : 0)}</div>
   <div class="grp"><span>Play a forced card automatically</span>${seg('auto', [[1, 'On'], [0, 'Off']], SET.auto ? 1 : 0)}</div>
   <div class="grp"><span>Our convention card (with partner)</span><div class="muted">Base system: 5-card majors, 15-17 1NT, weak twos, strong 2♣, Jacoby transfers, negative and takeout doubles.</div>${convs}</div>
   <div class="grp"><span>Sync between devices (GitHub)</span><div class="muted">Scores, statistics and the list of deals you have seen are kept in a private gist on your GitHub account. Play offline on any device; everything merges when it is online again.</div>
   ${GitSync.enabled ? `<div><b>Connected.</b> ${syncState.msg || (GitSync.last ? "Last sync " + new Date(GitSync.last).toLocaleString() : "")}</div><div class="row2"><button class="btn gold" id="sNow">Sync now</button><button class="btn" id="sOff">Disconnect</button></div>` : `<div class="muted">1. Open <a href="https://github.com/settings/tokens/new?scopes=gist&description=Bridge%20Table" target="_blank" rel="noopener">github.com → new token</a> (scope: <b>gist</b> only, expiration: no expiration) and copy the token.<br>2. Paste it here on each device (PC and phone).</div><div class="row2"><input id="syncToken" type="password" autocomplete="off" placeholder="ghp_…" class="tok"><button class="btn gold" id="sSave">Connect</button></div>${syncState.msg ? `<div class="muted">${syncState.msg}</div>` : ""}`}</div>
   <div class="muted">Changes apply from the next deal.${Store.online ? ' Settings and scores are saved to your account.' : ' Scores are saved on this device.'} Every deal you get is new — a deal is never dealt to you twice.</div>
   <div class="row2"><button class="btn gold" id="oClose">Close</button><button class="btn" id="sReset">Delete score history</button></div>`);
}
/* ---- entering a deal (hand record, PBN, or the code Claude reads from a photo) ---- */
const RANKS = { A: 12, K: 11, Q: 10, J: 9, T: 8, '9': 7, '8': 6, '7': 5, '6': 4, '5': 3, '4': 2, '3': 1, '2': 0 };
/* "AKQ2.K73.J5.T942" (spades.hearts.diamonds.clubs) or "S AKQ2 H K73 D J5 C T942" / "♠AKQ2 ♥K73 …" */
function parseHand(txt) {
  txt = String(txt || '').toUpperCase().replace(/10/g, 'T').trim();
  if (!txt) return null;
  const out = [], put = (s, str) => { for (const ch of str.replace(/[^AKQJT2-9]/g, '')) out.push(s * 13 + RANKS[ch]); };
  if (txt.includes('.')) { const parts = txt.split('.'); if (parts.length !== 4) throw new Error('Use four groups separated by dots: spades.hearts.diamonds.clubs'); [3, 2, 1, 0].forEach((s, i) => put(s, parts[i])); }
  else {
    const map = { S: 3, '♠': 3, H: 2, '♥': 2, D: 1, '♦': 1, C: 0, '♣': 0 };
    const re = /([SHDC♠♥♦♣])\s*:?\s*([AKQJT2-9\-—]*)/g; let m, any = false;
    while ((m = re.exec(txt))) { any = true; put(map[m[1]], m[2]); }
    if (!any) throw new Error('Could not read "' + txt + '"');
  }
  return out;
}
function parsePBN(txt) {
  const m = String(txt).match(/([NESW])\s*:\s*(\S+)\s+(\S+)\s+(\S+)\s+(\S+)/i); if (!m) return null;
  const first = 'NESW'.indexOf(m[1].toUpperCase()), hands = [[], [], [], []];
  for (let i = 0; i < 4; i++) hands[(first + i) % 4] = m[i + 2] === '-' ? null : parseHand(m[i + 2]);
  return hands;
}
function showDealEntry(err) {
  const v = ui.dealForm || { pbn: '', h: ['', '', '', ''], dealer: 0, vul: 0 };
  ui.dealForm = v;
  const seg = (name, opts, cur) => `<div class="seg" data-seg="${name}">${opts.map(([val, l]) => `<button data-v="${val}" class="${String(cur) === String(val) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  openOv('deal', `<h2>Enter a deal</h2>
   <div class="muted">Have a photo of a played board? Send it to Claude in the chat and ask for the PBN code, then paste it here. You can also type the hands: spades.hearts.diamonds.clubs, e.g. <b>AKQ2.K73.J5.T942</b> (T = 10). Leave one hand empty and it is filled with the remaining cards.</div>
   <div class="grp"><span>PBN code (optional)</span><input id="dPbn" class="tok wide" placeholder="N:AKQ2.K73.J5.T942 ..." value="${v.pbn.replace(/"/g, '&quot;')}"></div>
   ${[0, 1, 2, 3].map(s => `<div class="grp"><span>${SEAT[s]}</span><input id="dH${s}" class="tok wide" placeholder="AKQ2.K73.J5.T942" value="${v.h[s].replace(/"/g, '&quot;')}"></div>`).join('')}
   <div class="grp"><span>Dealer</span>${seg('ddealer', [[0, 'North'], [1, 'East'], [2, 'South'], [3, 'West']], v.dealer)}</div>
   <div class="grp"><span>Vulnerable</span>${seg('dvul', [[0, 'None'], [1, 'N-S'], [2, 'E-W'], [3, 'Both']], v.vul)}</div>
   ${err ? `<div class="err">${err}</div>` : ''}
   <div class="row2"><button class="btn gold" id="dPlay">Play this deal</button><button class="btn" id="oClose">Cancel</button></div>`);
}
function readDealForm() {
  const v = ui.dealForm; if (!$('dPbn')) return v;
  v.pbn = $('dPbn').value; for (let s = 0; s < 4; s++) v.h[s] = $('dH' + s).value; return v;
}
function startEnteredDeal() {
  const v = readDealForm();
  try {
    let hands = v.pbn.trim() ? parsePBN(v.pbn) : v.h.map(parseHand);
    if (!hands) throw new Error('Could not read the PBN code. It should look like N:AKQ2.K73.J5.T942 … with four hands.');
    const used = new Set(), empty = [];
    hands.forEach((h, s) => { if (!h) { empty.push(s); return; } for (const c of h) { if (used.has(c)) throw new Error('The card ' + RTXT[R(c)] + SUIT[S(c)] + ' appears twice.'); used.add(c); } });
    if (empty.length === 1) hands[empty[0]] = [...Array(52).keys()].filter(c => !used.has(c));
    else if (empty.length) throw new Error('Enter at least three hands.');
    hands.forEach((h, s) => { if (h.length !== 13) throw new Error(SEAT[s] + ' has ' + h.length + ' cards, it needs 13.'); });
    let bn = 1; for (let b = 1; b <= 16; b++) if (dealerOf(b) === v.dealer && vulOf(b, 0) === (v.vul === 1 || v.vul === 3) && vulOf(b, 1) === (v.vul === 2 || v.vul === 3)) { bn = b; break; }
    closeOv(); newBoard(hands, bn);
  } catch (e) { showDealEntry(e.message); }
}

function showResults() {
  const per = Store.periods(HIST), isImp = SET.mode === 'IMP', tab = ui.resTab;
  let body;
  if (tab === 'stats') {
    body = `<table class="res"><thead><tr><th>Period</th><th class="n">Boards</th><th class="n">${isImp ? 'IMPs' : 'MP %'}</th><th class="n">${isImp ? 'IMP/board' : 'IMPs'}</th><th class="n">Points</th></tr></thead><tbody>${per.map(p => `<tr><td>${p.name}</td><td class="n">${p.n}</td><td class="n">${isImp ? (p.scored ? fmtSigned(p.impSum) : '—') : (p.mpAvg != null ? p.mpAvg : '—')}</td><td class="n">${isImp ? (p.impAvg != null ? fmtSigned(p.impAvg) : '—') : (p.scored ? fmtSigned(p.impSum) : '—')}</td><td class="n">${fmtSigned(p.pts)}</td></tr>`).join('')}</tbody></table>
     <div class="muted">IMP: each of your results is compared with 8 robot tables (average cross-IMPs). MP: your percentage against the same field.</div>`;
  } else {
    const rows = HIST.slice(-100).reverse().map(e => `<tr><td>${new Date(e.ts || 0).toLocaleDateString()}</td><td>${e.board}</td><td>${e.passed ? 'Pass' : conKey(e.c)}</td><td>${e.passed ? '' : e.tricks}</td><td class="n">${fmtSigned(e.us || 0)}</td><td class="n">${e.imp == null ? '—' : isImp ? fmtSigned(e.imp) : e.mp + '%'}</td></tr>`).join('');
    body = `<table class="res"><thead><tr><th>Date</th><th>Board</th><th>Contract</th><th>Tricks</th><th class="n">Score</th><th class="n">${isImp ? 'IMP' : 'MP'}</th></tr></thead><tbody>${rows || '<tr><td colspan="6">No boards played yet.</td></tr>'}</tbody></table>`;
  }
  openOv('res', `<h2>Results</h2><div class="seg" data-seg="restab"><button data-v="stats" class="${tab === 'stats' ? 'on' : ''}">Statistics</button><button data-v="list" class="${tab === 'list' ? 'on' : ''}">Boards</button></div>${body}<div class="row2"><button class="btn gold" id="oClose">Close</button></div>`);
}

/* ================= events ================= */
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.conv) {
    const k = t.dataset.conv, c = E.CONVS.find(y => y.k === k);
    SET.conv[k] = t.checked;
    if (t.checked && c && c.x) SET.conv[c.x] = false;
    if (!t.checked && SET.practice === k) SET.practice = "";
    Store.saveSettings(SET); save(); showSettings();
  }
  if (t.id === "sPractice") { SET.practice = t.value; if (t.value) { SET.conv[t.value] = true; const c = E.CONVS.find(y => y.k === t.value); if (c && c.x) SET.conv[c.x] = false; } Store.saveSettings(SET); save(); showSettings(); }
});
document.addEventListener('click', ev_ => {
  const t = ev_.target.closest('button,[data-c],[data-ai],#toast,#dExpl'); if (!t) return;
  if (t.id === 'dExpl') { ui.lastExpl = null; ui.hintBid = null; render(); return; }
  if (t.id === 'toast') { ui.toast = null; render(); return; }
  if (t.dataset.ai != null) { ui.lastExpl = ui.lastExpl === +t.dataset.ai ? null : +t.dataset.ai; ui.hintBid = null; if (ui.overlay === 'auc') showAuction(); else render(); return; }
  if (t.dataset.lvl) { ui.selLvl = +t.dataset.lvl; renderBidbox(); return; }
  if (t.dataset.call != null && G.phase === 'bid' && bidTurn() === U()) { const v = t.dataset.call; const c = (v === 'P' || v === 'X' || v === 'XX') ? v : +v; if (c !== -1) makeCall(U(), c); return; }
  if (t.dataset.c != null && t.classList.contains('play')) { const c = +t.dataset.c; const seat = G.play.turn; if (G.play.hands[seat].includes(c)) playCard(seat, c); return; }
  if (t.closest('.seg')) {
    const seg = t.closest('.seg').dataset.seg, v = t.dataset.v;
    if (seg === 'restab') { ui.resTab = v; showResults(); return; }
    if (seg === 'ddealer' || seg === 'dvul') { readDealForm(); ui.dealForm[seg === 'ddealer' ? 'dealer' : 'vul'] = +v; showDealEntry(); return; }
    if (seg === 'seat') SET.seat = +v; if (seg === 'speed') SET.speed = +v; if (seg === 'expl') SET.expl = v === '1'; if (seg === 'auto') SET.auto = v === '1';
    if (seg === 'mode') SET.mode = v; if (seg === 'opp') SET.opp = v;
    Store.saveSettings(SET); save(); showSettings(); render(); return;
  }
  switch (t.id) {
    case 'bNew': case 'oNext2':
      if (t.id === 'oNext2' || G.phase === 'done' || ui.confirmNew > Date.now()) { ui.confirmNew = 0; newBoard(); }
      else { ui.confirmNew = Date.now() + 3000; renderBar(); setTimeout(renderBar, 3100); }
      break;
    case 'bAuc': showAuction(); break;
    case 'oShow': showEnd(); break;
    case 'bHint':
      if (G.phase === 'bid' && bidTurn() === U()) { ui.hintBid = E.aiBid(G.auction, U(), G.deal[U()], G.cards); SET.expl = true; render(); }
      else if (G.phase === 'play' && userControls(G.play.turn) && G.play.trick.length < 4) { ui.hintCard = E.aiPlay(G.play, G.play.turn); render(); }
      break;
    case "bClaim": claim(); break;
    case "bUndo": undo(); break;
    case "sDeal": showDealEntry(); break;
    case "dPlay": startEnteredDeal(); break;
    case "dExpl": ui.lastExpl = null; ui.hintBid = null; render(); break;
    case 'bSet': showSettings(); break;
    case 'bRes': showResults(); break;
    case 'oClose': closeOv(); break;
    case 'sReset': HIST = []; save(); showSettings(); render(); break;
    case "sSave": { const v = ($("syncToken") || {}).value; if (v) { GitSync.setToken(v); syncState.msg = ""; syncNow(); showSettings(); } break; }
    case "sNow": syncNow(); break;
    case "sOff": GitSync.setToken(null); syncState.msg = ""; showSettings(); break;
    case 'oNext': newBoard(); break;
    case 'oReplay': { const d = G.deal; HIST = HIST.filter(h => h.id !== G.id); BOARD = G.board; newBoard(d); break; }
  }
});
$('ov').addEventListener('click', e => { if (e.target.id === 'ov') closeOv(); });
window.addEventListener('resize', layoutFans);

/* ================= boot ================= */
function start(data) {
  load(data && data.G ? data : null);
  Field.init();
  if (!G || !G.deal || !G.cards) newBoard();
  else {
    if (!G.field || !G.field.done) Field.start(G); else Field.live[G.id] = { f: G.field, deal: G.deal, board: G.board };
    render(); if (G.phase === 'done') showEnd(); tick();
  }
  Store.initCloud(mergeCloud);
  syncNow(true);
  window.addEventListener("online", () => syncNow(true));
  // installable/offline app when served from a normal web address
  if ('serviceWorker' in navigator && document.querySelector('link[rel=manifest]') && /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.claude?.hot?.snapshot?.(() => ({ SET, G, HIST, BOARD }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>
