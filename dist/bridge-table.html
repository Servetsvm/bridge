<style>
/* Layout: one-screen card table — score strip on top, felt with four compass seats, the player's fanned hand docked at the bottom */
:root{
  --rail:#0c1a14;
  --felt:#1e5c3b;
  --felt-deep:#154629;
  --ink:#f2eee1;
  --muted:#a8c2b0;
  --card:#fffdf6;
  --card-2:#f1ebdb;
  --card-ink:#1b1b1b;
  --red:#c4122f;
  --brass:#d9b25c;
  --brass-ink:#2a2108;
  --vul:#b8322a;
  --panel:#e8eee6;
  --panel-ink:#14281d;
  --sheet:#f6f4ec;
  --sheet-ink:#1d241f;
  --sheet-muted:#5d6a60;
  --pos:#1d6b3c;
  --neg:#b3261e;
  --f-ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-card:"Bitter",Georgia,"Times New Roman",serif;
  --f-face:"Cinzel",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--rail);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
table{color:inherit;font:inherit}
#app{height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;padding-block:8px;gap:8px}
.red{color:var(--red)}

/* header strip */
#bar{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.vulbox{width:52px;height:52px;position:relative;background:var(--panel);color:var(--panel-ink);border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:22px;border:6px solid #f4f4f0;font-variant-numeric:tabular-nums}
.vulbox .dl{position:absolute;font-size:10px;font-weight:700;color:var(--panel-ink)}
.box{background:var(--panel);color:var(--panel-ink);border:0;border-radius:6px;padding:4px 8px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;min-width:64px;line-height:1.1;text-align:left}
button.box{box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.box small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.box b{font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.box .sm{font-size:12px}
.box .tr{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.spacer{flex:1}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{background:#e9e9e4;color:#222;border:0;border-radius:6px;padding:8px 10px;font-weight:600;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.gold{background:var(--brass);color:var(--brass-ink)}
.btn.new{background:#2f6f4a;color:#fff}
.btn.new.warn{background:var(--vul)}

/* table */
#table{flex:1;min-height:0;background:radial-gradient(ellipse at 50% 40%,var(--felt) 0%,var(--felt-deep) 100%);border-radius:14px;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr;gap:6px;padding:8px;position:relative;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
#pos2{grid-column:1/4;grid-row:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
#pos1{max-width:42vw;grid-column:1;grid-row:2;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
#pos3{max-width:42vw;grid-column:3;grid-row:2;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:4px;min-width:0}
#center{grid-column:2;grid-row:2;position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center}
#pos0{display:flex;flex-direction:column;align-items:center;gap:4px}
.lbl{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.28);padding:3px 8px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.lbl .tag{background:var(--brass);color:var(--brass-ink);border-radius:4px;padding:0 4px;font-size:11px}
.lbl.turn{box-shadow:0 0 0 2px var(--brass);background:rgba(217,178,92,.25)}
.lbl .vn{color:#ff9b8f}

/* cards */
.fan{display:flex;justify-content:center;width:100%;padding-top:10px}
.card{--cw:56px;width:var(--cw);height:calc(var(--cw)*1.42);flex:none;margin-left:var(--ov,0px);position:relative;background:linear-gradient(155deg,var(--card) 0%,var(--card) 55%,var(--card-2) 100%);color:var(--card-ink);border-radius:calc(var(--cw)*.1);border:1px solid #c7bea6;box-shadow:-2px 1px 5px rgba(0,0,0,.28);font-family:var(--f-card);user-select:none;overflow:hidden;transition:transform .12s}
.fan .card{--cw:inherit}
.fan{--cw:56px}
.fan .card:first-child{margin-left:0}
.card.rd{color:var(--red)}
.card .ix{position:absolute;top:calc(var(--cw)*.05);left:calc(var(--cw)*.05);width:calc(var(--cw)*.36);display:flex;flex-direction:column;align-items:center;line-height:.92}
.card .ix b{font-size:calc(var(--cw)*.34);font-weight:700;letter-spacing:-.07em}
.card .ix i{font-style:normal;font-size:calc(var(--cw)*.34)}
.card .pip{position:absolute;right:calc(var(--cw)*.08);bottom:calc(var(--cw)*.07);font-size:calc(var(--cw)*.6);line-height:1;display:flex;flex-direction:column;align-items:center}
.card.face .pip{font-size:calc(var(--cw)*.26);border:1.5px solid currentColor;border-radius:calc(var(--cw)*.06);padding:calc(var(--cw)*.05) calc(var(--cw)*.08);background:rgba(217,178,92,.2);right:calc(var(--cw)*.1);bottom:calc(var(--cw)*.1)}
.card.face .pip em{font-style:normal;font-family:var(--f-face);font-weight:700;font-size:calc(var(--cw)*.42);line-height:1}
.card.play{cursor:pointer}
.card.play:hover{transform:translateY(-8px)}
.card.dim{filter:brightness(.6) saturate(.8)}
.card.hint{box-shadow:0 0 0 3px var(--brass);transform:translateY(-10px)}
.vh{display:flex;flex-direction:column;gap:3px}
.vh .row{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.vh .sy{width:14px;font-size:15px;text-align:center}
.mini{display:inline-grid;place-items:center;min-width:23px;height:30px;padding:0 3px;background:linear-gradient(155deg,var(--card),var(--card-2));color:var(--card-ink);border:1px solid #c7bea6;border-radius:4px;font:700 14px var(--f-card);letter-spacing:-.05em}
.mini.rd{color:var(--red)}
.mini.play{cursor:pointer}
.mini.dim{filter:brightness(.6)}
.mini.hint{box-shadow:0 0 0 3px var(--brass)}
.backs{display:flex}
.backs i{width:13px;height:19px;border-radius:2px;background:repeating-linear-gradient(45deg,#7d1626 0 3px,#a3283a 3px 6px);border:1px solid #f1e9d6;margin-left:-6px}
.backs i:first-child{margin-left:0}

/* trick */
.trick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100%,300px);height:min(100%,260px)}
.card.tc{--cw:clamp(44px,12vw,64px);position:absolute;margin:0;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.tc.p0{left:50%;bottom:2%;transform:translateX(-50%)}
.tc.p2{left:50%;top:2%;transform:translateX(-50%)}
.tc.p1{left:4%;top:50%;transform:translateY(-50%)}
.tc.p3{right:4%;top:50%;transform:translateY(-50%)}
.tc.win{box-shadow:0 0 0 3px var(--brass),0 3px 8px rgba(0,0,0,.4)}
.donebox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.donebox b{font-size:18px}

/* auction */
.auction{background:var(--panel);color:var(--panel-ink);border-radius:8px;overflow:auto;min-height:0;flex:0 1 auto;font-size:16px}
.auction table{width:100%;border-collapse:collapse;table-layout:fixed;color:var(--panel-ink)}
.auction th{font-weight:600;padding:4px 2px;background:#fff;color:var(--panel-ink);font-size:14px}
.auction th.v{background:var(--vul);color:#fff}
.auction th.me{text-decoration:underline;text-underline-offset:3px}
.auction td{text-align:center;padding:3px 2px;font-weight:600}
.auction td .c{display:inline-block;padding:1px 6px;border-radius:4px;cursor:pointer}
.auction td .c.cvb{border-bottom:2px dotted #8a6d22}
.auction td .c.sel{background:#d6c38e}
.expl{margin-top:6px;background:#ded7b8;color:#2a2410;border-radius:8px;padding:6px 8px;font-size:14px;min-height:40px;line-height:1.3;max-height:34vh;overflow:auto}
.expl b{font-size:15px}
.expl .cv{margin-top:4px;font-size:13px;color:#4a3f1c}
.expl .cv span{display:inline-block;background:#8a6d22;color:#fff;border-radius:4px;padding:0 5px;margin-right:5px;font-weight:600}

/* bidding box */
#bidbox{display:flex;flex-direction:column;gap:5px}
#bidbox .row{display:flex;gap:4px}
#bidbox button{flex:1;min-width:0;border:0;border-radius:6px;background:#f2f2ee;color:#1e1e1e;font-weight:700;font-size:20px;padding:7px 0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
#bidbox button.sel{background:var(--brass)}
#bidbox button:disabled{opacity:.3;cursor:default}
#bidbox button.pass{background:#a9cc8e}
#bidbox button.dbl{background:#c8102e;color:#fff}
#bidbox button.rdbl{background:#2f5fa8;color:#fff}
#bidbox button.st.r{color:var(--red)}
#status{font-size:14px;color:var(--muted);text-align:center;min-height:18px}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:var(--sheet);color:var(--sheet-ink);border-radius:12px;padding:16px;width:min(620px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:22px;text-wrap:balance}
.sheet .grp{display:flex;flex-direction:column;gap:6px}
.sheet .grp>span{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--sheet-muted)}
.sheet .expl{max-height:none}
.muted{color:var(--sheet-muted);font-size:13px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid #c7c9bd;background:#fff;border-radius:6px;padding:8px 6px;font-weight:600;color:#222}
.seg button.on{background:var(--felt);color:#fff;border-color:var(--felt)}
.cvrow{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #dcdccf;border-radius:8px;padding:8px}
.cvrow input{width:20px;height:20px;margin-top:2px;accent-color:var(--felt);flex:none}
.cvrow span{display:flex;flex-direction:column;gap:2px;min-width:0}
.cvrow small{color:var(--sheet-muted);font-size:12.5px;line-height:1.3}
.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.res th,.res td{padding:5px 4px;border-bottom:1px solid #ddd;text-align:left}
.res .n{text-align:right}
.score2{display:flex;gap:8px}
.score2 div{flex:1;background:#fff;border:1px solid #dcdccf;border-radius:8px;padding:6px 10px;display:flex;flex-direction:column}
.score2 div.on{border-color:var(--felt);box-shadow:inset 0 0 0 1px var(--felt)}
.score2 small{font-size:11px;letter-spacing:.07em;color:var(--sheet-muted)}
.score2 b{font-size:22px;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.deal{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-family:var(--f-card);font-size:14px}
.deal .h{background:#fff;border-radius:6px;padding:6px;line-height:1.35;min-width:0}
.deal .h b{font-family:var(--f-ui);font-size:12px;display:block;color:var(--sheet-muted)}
.deal .n{grid-column:2}.deal .w{grid-column:1;grid-row:2}.deal .e{grid-column:3;grid-row:2}.deal .s{grid-column:2;grid-row:3}
.big{font-size:20px;font-weight:700}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 .btn{flex:1}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--brass);color:var(--brass-ink);padding:10px 14px;border-radius:10px;font-weight:700;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:3;cursor:pointer;max-width:90%}
@media (max-width:560px){
  #app{gap:6px;padding-block:6px}
  .vulbox{width:44px;height:44px;font-size:18px;border-width:5px}
  .box b{font-size:16px}
  .btn{padding:7px 7px;font-size:13.5px}
  .tools{gap:4px}
  #bidbox button{font-size:18px;padding:6px 0}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

/* large suit symbols in bids, auction and explanations */
.sym{font-size:1.35em;line-height:1;vertical-align:-.1em;font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",sans-serif}
.auction{font-size:19px}
.auction td .c{padding:2px 8px}
.expl{font-size:15px}
#bidbox button.st{font-size:30px;line-height:1;padding:6px 0}
#bidbox button.st.nt{font-size:22px}
.deal .sym{font-size:1.2em}
/* during the auction the bidding table uses the full felt width */
#table.bidding #pos1,#table.bidding #pos3{display:none}
#table.bidding #center{grid-column:1/4}
#table.bidding .auction,#table.bidding .expl{width:min(100%,560px);align-self:center}
.tok{flex:2;min-width:0;border:1px solid #c7c9bd;border-radius:6px;padding:8px;font:inherit;background:#fff;color:#222}
/* short screens: keep the table usable and let the page scroll */
#table{min-height:250px}
@media (max-height:640px){body{overflow-y:auto}#app{height:auto;min-height:100%}}
/* compact table: partner's/dummy's cards, the trick and your hand sit close together near the bottom of the screen */
#table{flex:0 1 auto;margin-top:auto;grid-template-rows:auto minmax(190px,auto)}
#center{min-height:190px}
.trick{height:min(100%,200px);width:min(100%,280px)}
.card.tc{--cw:clamp(42px,11vw,58px)}
.fan{padding-top:6px}

/* ---- card face v2: big clear corner index, clean overlaps ---- */
.card{background:linear-gradient(170deg,#ffffff 0%,#fbf8f0 60%,#f1ebdb 100%);border:1px solid #b9b09a;border-radius:calc(var(--cw)*.09);box-shadow:-3px 0 6px rgba(0,0,0,.22)}
.card .ix{top:calc(var(--cw)*.05);left:calc(var(--cw)*.04);width:calc(var(--cw)*.42)}
.card .ix b{font-size:calc(var(--cw)*.44);letter-spacing:-.08em;font-weight:700}
.card .ix i{font-size:calc(var(--cw)*.42);margin-top:-.06em}
.fan .card:not(:last-child) .pip{display:none}
.card.face .pip{background:linear-gradient(160deg,rgba(217,178,92,.28),rgba(217,178,92,.08))}
/* playable cards rise, others stay calm instead of turning grey */
.fan .card.play{transform:translateY(-7px)}
.fan .card.play:hover{transform:translateY(-12px)}
.fan .card.dim{filter:none;opacity:.78}
.fan .card.dim .ix{opacity:.7}
.card.hint{transform:translateY(-14px)!important}
/* side dummy: small overlapping real cards */
.vh .row{flex-wrap:nowrap}
.vh .sy{width:16px;font-size:17px}
.mini{min-width:26px;height:38px;padding:3px 4px 0;place-items:start center;font:700 16px var(--f-card);border:1px solid #b9b09a;border-radius:4px;background:linear-gradient(170deg,#fff,#f1ebdb);box-shadow:-2px 0 4px rgba(0,0,0,.22);margin-left:-9px}
.vh .row .sy+.mini{margin-left:2px}
.mini.play{transform:translateY(-4px)}
.mini.dim{filter:none;opacity:.75}
.fan{padding-top:14px}
.fan .card.dim{opacity:1;filter:brightness(.9) saturate(.55)}
.fan .card.dim .ix{opacity:1}
.mini.dim{opacity:1;filter:brightness(.9) saturate(.55)}
.sel{border:1px solid #c7c9bd;border-radius:6px;padding:8px;font:inherit;background:#fff;color:#222}
.tok.wide{width:100%;flex:none;font-family:ui-monospace,Consolas,monospace;font-size:14px}
.err{background:#fde8e6;color:#8c1d14;border-radius:6px;padding:8px;font-size:14px}
.xo{font-style:normal;font-size:11.5px;color:#8a6d22}
.muted.tap{color:var(--muted);text-align:center;margin-top:6px;font-size:13px}
#dExpl{cursor:pointer}
/* larger score strip */
.vulbox{width:62px;height:62px;font-size:26px}
.vulbox .dl{font-size:12px}
.box{padding:6px 12px;min-width:84px;gap:1px}
.box small{font-size:13px}
.box b{font-size:23px}
.box .sm{font-size:14px}
.box .tr{font-size:15px}
@media (max-width:560px){
  .vulbox{width:56px;height:56px;font-size:23px}
  .box{padding:5px 10px;min-width:76px}
  .box small{font-size:12px}
  .box b{font-size:20px}
  .box .tr{font-size:14px}
}

/* ================= Classic look (default): flat tiles like club bridge apps ================= */
body.classic{background:#000;font-family:Roboto,"Segoe UI",Arial,sans-serif}
body.classic #app{padding-inline:2px;gap:4px}
body.classic #table{background:#1f7a2e;border-radius:0;box-shadow:none;padding:4px 0;gap:4px}
body.classic .lbl{background:rgba(0,0,0,.35);font-size:12px}
/* score strip */
body.classic .vulbox{background:#9fd3d6;color:#10292b;border-radius:8px}
body.classic .box{background:#9fd3d6;color:#10292b;border-radius:4px}
body.classic .box small{opacity:.8}
body.classic .btn{background:linear-gradient(#f4f4f4,#d9d9d9);color:#111;border:1px solid #9a9a9a;border-radius:3px;box-shadow:none}
body.classic .btn.gold{background:linear-gradient(#ffe27a,#f2c230);border-color:#b8901a}
body.classic .btn.new{background:linear-gradient(#5fbf6a,#2e8b3a);color:#fff;border-color:#226b2c}
/* card tiles */
body.classic .card{border-radius:3px;border:1px solid #8c8c8c;background:#fff;box-shadow:none;height:calc(var(--cw)*1.78);font-family:Roboto,"Arial Narrow",Arial,sans-serif;color:#000}
body.classic .card.rd{color:#d0021b}
body.classic .card .pip{display:none}
body.classic .card .ix{position:static;width:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;height:100%;padding-top:calc(var(--cw)*.06);line-height:1}
body.classic .card .ix b{font-size:calc(var(--cw)*.82);font-weight:700;letter-spacing:-.06em}
body.classic .card .ix i{font-size:calc(var(--cw)*.9);margin-top:calc(var(--cw)*.04)}
body.classic .card.face{background:#fff}
body.classic .fan{padding-top:10px}
body.classic .fan .card{margin-left:1px}
body.classic .fan .card:first-child{margin-left:0}
body.classic .fan .card.play{transform:translateY(-6px)}
body.classic .fan .card.dim{filter:none;background:#e6e6e6}
body.classic .card.tc{--cw:clamp(40px,11vw,58px);border:1px solid #666}
/* side hands: one row of small tiles per suit */
body.classic .vh{gap:2px}
body.classic .vh .sy{display:none}
body.classic .mini{display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-start;min-width:0;width:26px;height:46px;padding:2px 0 0;margin-left:-6px;border:1px solid #8c8c8c;border-radius:3px;background:#fff;box-shadow:-1px 0 2px rgba(0,0,0,.25);font:700 19px/1 Roboto,Arial,sans-serif;color:#000;letter-spacing:-.06em}
body.classic .vh .row .mini:first-of-type{margin-left:0}
body.classic .mini.rd{color:#d0021b}
body.classic .mini i{font-style:normal;font-size:19px;margin-top:2px}
body.classic .mini.dim{filter:none;background:#e6e6e6}
/* end of board: yellow banner over the open deal */
body.classic .donebox,.donebanner{background:linear-gradient(#ffd84a,#f2b705);color:#111;border:2px solid #8a6a00;border-radius:6px;padding:10px 14px;text-align:center;font:700 20px/1.25 Roboto,Arial,sans-serif;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.4);max-width:92%;align-self:center}
.donebanner small{display:block;font-size:14px;font-weight:600;margin-top:4px}
.donebanner .pos{color:#0b5d1e}.donebanner .neg{color:#9b0d0d}
body:not(.classic) .mini i{display:none}
body.classic .card{height:calc(var(--cw)*1.95)}
.donebanner{font-size:17px;border:2px solid #8a6a00}
@media (max-width:560px){.donebanner{font-size:15px;padding:8px 10px}}
.okmsg{background:#e3f4e6;color:#14532d;border-radius:6px;padding:8px;font-size:14px}
#status .sig{margin-top:3px;background:#fff6cf;color:#3d2f00;border-radius:6px;padding:4px 8px;font-size:14px;display:inline-block}
.btn.guide{display:block;text-align:center;text-decoration:none}
.helprow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #dcdccf;border-radius:8px;padding:8px 10px}
.helprow span{flex:1}
.helprow .btn{text-decoration:none}
.seg2{display:flex;gap:4px;flex-wrap:wrap}
.seg2 button{flex:1;border:1px solid #c7c9bd;background:#fff;border-radius:6px;padding:8px 6px;font-weight:600;color:#222}
.seg2 button.on{background:var(--felt);color:#fff;border-color:var(--felt)}
.bigcode{font:700 34px/1.1 ui-monospace,Consolas,monospace;letter-spacing:.18em;color:#14532d}
.chatlist{max-height:46vh;min-height:120px;overflow:auto;display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid #dcdccf;border-radius:8px;padding:8px}
.cm{background:#eef3ec;border-radius:10px;padding:6px 10px;max-width:85%;align-self:flex-start;font-size:15px;line-height:1.3;word-break:break-word}
.cm.me{background:#d9f0d3;align-self:flex-end}
.cm.sys{background:none;color:#5d6a60;font-style:italic;font-size:13px;align-self:center;text-align:center}
.cm small{display:block;font-size:11px;color:#7a857c;margin-top:2px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid #c7c9bd;background:#fff;border-radius:999px;padding:5px 10px;font-size:14px;color:#222}
#nMsg{flex:3}
.resscroll{overflow-x:auto}
#center{cursor:pointer}
.trick.lasttrick .card.tc{filter:saturate(.85);box-shadow:0 0 0 2px rgba(255,255,255,.5),0 3px 8px rgba(0,0,0,.4)}
.trick.lasttrick .card.tc.win{box-shadow:0 0 0 3px var(--brass),0 3px 8px rgba(0,0,0,.4)}
.lastlbl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.lasthint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.55);font-size:12px;white-space:nowrap;pointer-events:none}

/* iPhone / Safari: size the app to the visible screen (toolbars included), keep clear of the notch and the
   home indicator, and let the page scroll if something still does not fit */
body{overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
#app{height:100%;height:100dvh;min-height:0;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.classic #app{padding-left:max(2px,env(safe-area-inset-left,0px));padding-right:max(2px,env(safe-area-inset-right,0px))}
@supports not (height:100dvh){#app{height:auto;min-height:100%}}

/* phones: everything needed to bid (auction, bidding box, own hand) fits on one screen without scrolling.
   The app grows instead of clipping, the felt shrinks to the auction while bidding, and the tool buttons
   sit in a single sideways-scrolling row. */
#app{height:auto;min-height:100%;min-height:100dvh}
#table.bidding{min-height:0;grid-template-rows:auto auto}
#table.bidding #center{min-height:0}
@media (max-width:560px){
  #bar{gap:6px;row-gap:4px}
  #bar .tools{display:flex;flex-wrap:nowrap;overflow-x:auto;width:100%;gap:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #bar .tools::-webkit-scrollbar{display:none}
  #bar .tools .btn{flex:none;padding:6px 9px;font-size:13.5px}
  #bar .spacer{display:none}
  .vulbox{width:48px;height:48px;font-size:20px;border-width:5px}
  .box{padding:3px 8px;min-width:70px}
  .box b{font-size:18px}
  .box .tr{font-size:13px}
  #table{min-height:0}
  #table.bidding .auction{font-size:17px}
  #bidbox{gap:4px}
  #bidbox button{padding:5px 0}
  #bidbox button.st{font-size:26px;padding:4px 0}
}

/* online waiting room: the felt shows the seats instead of cards until the host presses Start */
#table.lobby #pos1,#table.lobby #pos2,#table.lobby #pos3{display:none}
#table.lobby #center{grid-column:1/4;cursor:default}
body.inlobby #pos0{display:none}
.lobby{background:var(--sheet,#f6f3e8);color:var(--sheet-ink,#222);border-radius:10px;padding:12px;width:min(100%,440px);align-self:center;display:flex;flex-direction:column;gap:8px}
.lobby h3{margin:0;font-size:18px}
.lseat{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dcdccf;border-radius:8px;padding:8px 10px;min-height:44px}
.lseat b{width:52px;flex:none}
.lseat span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lseat.me{border-color:var(--brass,#c9a227);box-shadow:inset 0 0 0 1px var(--brass,#c9a227)}
.lseat .btn{flex:none;padding:6px 10px}
.lobby .row2 .btn{font-size:16px;padding:10px}
.lseat.req{background:#fff6d6;border-color:var(--brass,#c9a227)}
.lseat.req .btn{padding:6px 10px}

/* Results: tap a board to look back at it */
tr.rev{cursor:pointer}
tr.rev:hover td,tr.rev:active td{background:#f3efdd}
.res.play td,.res.play th{text-align:center;padding:4px 6px}
.res.play td.win{font-weight:800;background:#fff3c4}
.res.play td.lead{text-decoration:underline;text-underline-offset:3px}
.res.play .sym{font-size:1.15em}
/* replay of a finished board: hands round the table, the trick in the middle */
.deal.replay{align-items:stretch}
.deal.replay .h.turn{box-shadow:0 0 0 2px var(--brass,#c9a227)}
.rtrick{grid-column:2;grid-row:2;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;place-items:center;background:#1f7a2e;border-radius:8px;min-height:120px;cursor:pointer;padding:4px}
.rtrick .rc{background:#fff;color:#111;border:1px solid #9a9a9a;border-radius:4px;padding:3px 6px;font-weight:800;font-size:17px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.rtrick .rc.n{grid-column:2;grid-row:1}.rtrick .rc.w{grid-column:1;grid-row:2}.rtrick .rc.e{grid-column:3;grid-row:2}.rtrick .rc.s{grid-column:2;grid-row:3}
.rtrick .rc.win{background:#fff3c4;box-shadow:0 0 0 2px var(--brass,#c9a227)}
.rstat{text-align:center;font-weight:700;margin:6px 0 4px}
.rctl{display:flex;gap:6px;justify-content:center}
.rctl .btn{min-width:46px;font-size:17px}
/* phones: tool buttons wrap onto a second row instead of scrolling sideways, and the table sits right
   under the top bar (no empty space above it) while bidding and while playing */
@media (max-width:560px){
  #bar .tools{flex-wrap:wrap;overflow-x:visible}
  #bar .tools .btn{flex:1 0 auto;padding:7px 8px}

/* lobby and waiting room: each table drawn as a small card table with the players round it */
.tbls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tbl{display:grid;grid-template-columns:1fr 1.25fr 1fr;grid-template-rows:auto auto auto;gap:6px;align-items:center;justify-items:center;background:#0f3d18;border-radius:12px;padding:8px}
.tbl .tseat{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;color:#fff;min-width:0;max-width:100%;font-size:14px;line-height:1.2}

.tbl .tmid{grid-column:2;grid-row:2;background:#1f7a2e;border-radius:10px;min-height:96px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px;text-align:center;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}

      add(B(4, M), h => h.len[M] >= 3 && h.hcp >= 12, { t: 'Game with a ' + SUIT[M] + ' fit' });
      add('P', h => h.len[M] >= 2, { t: 'Pass to play in ' + SUIT[M] });
      add(B(2, 4), () => rhoPass, { tag: 'ask', cv: 'capp', t: 'Relay: which minor?' });
    }
    if (pm.tag === 'capp2N') { add(B(3, 1), h => h.len[1] > h.len[0], { t: 'Choosing the minor: ♦' }); add(B(3, 0), () => true, { t: 'Choosing the minor: ♣' }); }
    if (L.length) return L;
  }
  if (myLast && pLast && pm.tag === 'relay' && mm.tag === 'capp1') {
    add('P', h => h.longest === 1, { t: 'My long suit is diamonds' });
    for (const s of [2, 3, 0]) add(B(s === 0 ? 3 : 2, s), h => h.longest === s, { len: { [s]: 6 }, t: 'My long suit is ' + SUIT[s] });
    return L;
  }
  if (myLast && pLast && pm.tag === 'ask' && (mm.tag === 'cappH' || mm.tag === 'cappS' || (mm.tag === 'mich' && mm.major != null))) {
    add(B(3, 1), h => h.len[1] > h.len[0], { len: { 1: 4 }, t: 'My minor is diamonds' });
    add(B(3, 0), () => true, { len: { 0: 4 }, t: 'My minor is clubs' });
    return L;
  }
  if (my.length === 0 && pLast && (pm.tag === 'mich' || pm.tag === 'unusual') && pJust) {
    const cheap = s => (ST(st.last) < s ? LV(st.last) : LV(st.last) + 1);
    if (pm.tag === 'mich' && pm.major == null) {
      for (const s of [3, 2]) add(B(4, s), h => h.len[s] >= 4 && h.len[s] >= h.len[otherMajor(s)] && h.hcp >= 10, { t: 'Game with a ' + SUIT[s] + ' fit' });
      add(B(cheap(3), 3), h => h.len[3] > h.len[2], { len: { 3: 3 }, t: 'Choosing the major: ♠' });
      add(B(cheap(2), 2), () => true, { len: { 2: 3 }, t: 'Choosing the major: ♥' });
    } else if (pm.tag === 'mich') {
      const M = pm.major;
      add(B(4, M), h => h.len[M] >= 3 && h.hcp >= 10, { t: 'Game with a ' + SUIT[M] + ' fit' });
      add(B(cheap(M), M), h => h.len[M] >= 2, { len: { [M]: 2 }, t: 'Choosing ' + SUIT[M] });
      add(B(cheap(4), 4), () => cheap(4) <= 2, { tag: 'ask', cv: 'michaels', t: 'Asking for the minor' });
    } else {
      const [a, b] = pm.suits;
      add(B(cheap(b), b), h => h.len[b] > h.len[a], { t: 'Choosing ' + SUIT[b] });
      add(B(cheap(a), a), () => true, { t: 'Choosing ' + SUIT[a] });
    }
    add('P', () => true, { t: 'Pass' });
    return L;
  }

  /* ===== opening (by the side's system) ===== */
  if (!opening) {
    const pos = auc.length, ag = x.agg > 0 ? 1 : 0, Y = x.sys, sk = Y.k;
    const [n1, n2] = Y.nt, [t1, t2] = Y.nt2, Z = Y.n;
    const can = h => { const ls = [...h.len].sort((a, b) => b - a); if (pos === 3) return h.hcp >= 13 - ag || (h.hcp >= 10 && h.hcp + h.len[3] >= 15); return h.hcp >= 12 - ag || (h.hcp >= 10 && h.hcp + ls[0] + ls[1] >= 20); };
    const ntBal = (lo, hi) => h => h.bal && h.hcp >= lo && h.hcp <= hi;
    const weakTwo = s => h => h.len[s] === 6 && h.hcp >= 5 && h.hcp <= 10 && h.top5(s) >= 2;
    const preempts = () => {
      if (pos >= 3) return;
      if (C.gamb) add(B(3, 4), h => [0, 1].some(s => h.len[s] >= 7 && h.has(s, 12) && h.has(s, 11) && h.has(s, 10)) && [0, 1, 2, 3].every(s => h.len[s] >= 7 || (!h.has(s, 12) && !h.has(s, 11))), { min: 9, max: 13, tag: 'gamb', cv: 'gamb', t: 'Gambling 3NT: solid 7+ card minor, nothing outside' });
      for (const s of [3, 2]) add(B(4, s), h => h.len[s] >= 8 && h.hcp >= 5 && h.hcp <= 11, { min: 5, max: 11, len: { [s]: 8 }, cv: 'pre', t: 'Preempt: 8+ ' + SUIT[s] + ', 5-11 HCP', tag: 'pre' });
    };
    const threes = () => { if (pos < 3) for (const s of [3, 2, 1, 0]) add(B(3, s), h => h.len[s] >= 7 && h.hcp >= 5 && h.hcp <= 10 && h.top5(s) >= 2, { min: 5, max: 10, len: { [s]: 7 }, cv: 'pre', t: 'Preempt: 7+ ' + SUIT[s] + ', 5-10 HCP', tag: 'pre' }); };
    const weakTwos = suits => { if (pos < 3) for (const s of suits) add(B(2, s), weakTwo(s), { min: 5, max: 10, len: { [s]: 6 }, cv: 'weak2', t: 'Weak two: six ' + SUIT[s] + ', 5-10 HCP', tag: 'weak' }); };
    const nts = () => {
      add(B(2, 4), ntBal(t1, t2), { min: t1, max: t2, len: BAL, t: 'Balanced, ' + t1 + '-' + t2 + ' HCP', tag: 'nt2' });
      add(B(1, 4), ntBal(n1, n2), { min: n1, max: n2, len: BAL, cv: 'nt1', t: 'Balanced, ' + n1 + '-' + n2 + ' HCP (' + Z + ')', tag: 'nt1' });
    };
    if (sk === 'precision') {
      // strong club: every 16+ hand opens 1♣ (except the 2NT range); the other openings show 11-15
      nts();
      add(B(1, 0), h => h.hcp >= 16, { min: 16, tag: 'sclub', cv: 'sys', f: 1, t: 'Precision 1♣: 16+ HCP, any shape (artificial, forcing)' });
      preempts();
      const lim = h => can(h) && h.hcp <= 15;
      add(B(1, 3), h => lim(h) && h.len[3] >= 5 && h.len[3] >= h.len[2], { min: 11, max: 15, len: { 3: 5 }, t: '5+ ♠, 11-15 HCP (Precision)' });
      add(B(1, 2), h => lim(h) && h.len[2] >= 5, { min: 11, max: 15, len: { 2: 5 }, t: '5+ ♥, 11-15 HCP (Precision)' });
      add(B(2, 0), h => lim(h) && (h.len[0] >= 6 || (h.len[0] >= 5 && Math.max(h.len[2], h.len[3]) === 4)), { min: 11, max: 15, len: { 0: 6 }, cv: 'sys', t: 'Precision 2♣: 6+ ♣ (or 5♣ and a 4-card major), 11-15 HCP' });
      add(B(2, 1), h => lim(h) && h.len[2] >= 4 && h.len[3] >= 4 && h.len[1] <= 1 && h.len[0] >= 4, { min: 11, max: 15, len: { 0: 4, 2: 4, 3: 4 }, cv: 'sys', t: 'Precision 2♦: three-suited, short in ♦ (4-4-1-4 or 4-4-0-5), 11-15 HCP' });
      weakTwos([3, 2]); threes();
      add(B(1, 1), h => lim(h), { min: 11, max: 15, len: { 1: 2 }, cv: 'sys', t: 'Precision 1♦: 11-15 HCP, 2+ ♦ (no 5-card major, not 1NT, not 2♣)' });
    } else if (sk === 'polish') {
      // Polish Club: 1♣ covers 12-14 balanced, 15+ with long clubs and every strong hand (18+)
      add(B(2, 4), ntBal(t1, t2), { min: t1, max: t2, len: BAL, t: 'Balanced, ' + t1 + '-' + t2 + ' HCP', tag: 'nt2' });
      add(B(1, 4), ntBal(n1, n2), { min: n1, max: n2, len: BAL, cv: 'nt1', t: 'Balanced, ' + n1 + '-' + n2 + ' HCP (' + Z + ')', tag: 'nt1' });
      add(B(1, 0), h => h.hcp >= 18 || (h.bal && h.hcp >= 12 && h.hcp <= 14), { min: 12, tag: 'pclub', cv: 'sys', f: 1, t: 'Polish 1♣: 12-14 balanced, or 15+ with long clubs, or 18+ any shape' });
      preempts();
      const lim = h => can(h) && h.hcp <= 17;
      add(B(1, 3), h => lim(h) && h.len[3] >= 5 && h.len[3] >= h.len[2], { min: 12, max: 17, len: { 3: 5 }, t: '5+ ♠, 12-17 HCP (Polish Club)' });
      add(B(1, 2), h => lim(h) && h.len[2] >= 5, { min: 12, max: 17, len: { 2: 5 }, t: '5+ ♥, 12-17 HCP (Polish Club)' });
      add(B(2, 0), h => lim(h) && h.hcp <= 15 && h.len[0] >= 6 && !h.bal, { min: 11, max: 15, len: { 0: 6 }, cv: 'sys', t: 'Polish 2♣: 6+ ♣, 11-15 HCP' });
      if (pos < 3) add(B(2, 1), h => weakTwo(2)(h) || weakTwo(3)(h), { min: 5, max: 10, tag: 'multi', cv: 'sys', t: 'Multi 2♦: a weak two (six cards) in ♥ or ♠, 5-10 HCP' });
      threes();
      add(B(1, 1), h => lim(h) && h.len[1] >= 4 && !h.bal, { min: 12, max: 17, len: { 1: 4 }, t: '4+ ♦, 12-17 HCP, unbalanced (Polish Club)' });
      add(B(1, 0), h => can(h), { min: 12, tag: 'pclub', cv: 'sys', f: 1, t: 'Polish 1♣: 12-14 balanced, or 15+ with long clubs, or 18+ any shape' });
    } else {
      // natural systems: SAYC, 2/1, Acol, French Standard
      if (sk === 'sef') {
        add(B(2, 1), h => h.hcp >= 23 || (h.hcp >= 20 && h.lp >= 4), { min: 23, tag: '2c', cv: 'sys', f: 1, gf: 1, t: 'SEF 2♦: artificial game force (23+ HCP or about nine tricks)' });
        add(B(2, 0), h => h.hcp >= 20 && !h.bal, { min: 20, max: 22, cv: 'strong2c', f: 1, t: 'SEF 2♣: strong (20-22, unbalanced), forcing for one round' });
      } else add(B(2, 0), h => h.hcp >= (sk === 'acol' ? 23 : 22) || (h.hcp >= 19 && h.lp >= 4), { min: sk === 'acol' ? 23 : 22, cv: 'strong2c', t: 'Strong and artificial: ' + (sk === 'acol' ? 23 : 22) + '+ HCP, game forcing', f: 1, gf: 1, tag: '2c' });

        add(B(1, 1), h => can(h) && h.len[1] >= h.len[0] && h.len[1] >= 4, { min: 11, max: 22, len: { 1: 4 }, t: '4+ ♦, 12-22 HCP (Acol)' });

    }
    add('P', () => true, { max: 12, t: 'No opening values' });
    return L;
  }

  const oppOpened = sideOf(opening.seat) !== sideOf(x.seat);

  /* ===== overcall position: our side has not acted yet ===== */
  if (oppOpened && my.length === 0 && pa.length === 0) {
    const ob = st.last, os = ST(ob);
    const bal4 = auc.length >= 3 && auc[auc.length - 1].call === 'P' && auc[auc.length - 2].call === 'P';
    const d = bal4 ? 3 : 0;

    if (os === 4) {

        add(B(2, 2), h => h.len[2] >= 4 && h.len[3] >= 4 && Math.max(h.len[2], h.len[3]) >= 5 && h.hcp >= 8, { min: 8, len: { 2: 4, 3: 4 }, tag: 'dontM', cv: 'dont', t: 'DONT: both majors' });
        add(B(2, 1), h => h.len[1] >= 5 && Math.max(h.len[2], h.len[3]) >= 4 && h.hcp >= 8, { min: 8, len: { 1: 5 }, tag: 'dont2', cv: 'dont', t: 'DONT: diamonds and a major' });
        add(B(2, 0), h => h.len[0] >= 5 && Math.max(h.len[1], h.len[2], h.len[3]) >= 4 && h.hcp >= 8, { min: 8, len: { 0: 5 }, tag: 'dont2', cv: 'dont', t: 'DONT: clubs and a higher suit' });
        add(B(2, 3), h => h.len[3] >= 6 && h.hcp >= 8, { min: 8, len: { 3: 6 }, cv: 'dont', t: 'DONT: long spades (natural)' });
        add('X', h => Math.max(h.len[0], h.len[1], h.len[2]) >= 6 && h.hcp >= 8, { min: 8, tag: 'dontX', cv: 'dont', t: 'DONT: a one-suiter (6+), not spades' });
        add('P', () => true, { t: 'Pass' });
        return L;
      }
      if (C.capp && ob === B(1, 4) && x.oppBids.length === 1 && !bal4) {
        add('X', h => h.hcp >= 15, { min: 15, tag: 'cappX', cv: 'capp', t: 'Cappelletti: penalty double, 15+ HCP' });
        add(B(2, 4), h => h.len[0] >= 5 && h.len[1] >= 5 && h.hcp >= 8, { min: 8, len: { 0: 5, 1: 5 }, tag: 'capp2N', cv: 'capp', t: 'Cappelletti: both minors (5-5)' });
        add(B(2, 1), h => h.len[2] >= 4 && h.len[3] >= 4 && Math.max(h.len[2], h.len[3]) >= 5 && h.hcp >= 8, { min: 8, len: { 2: 4, 3: 4 }, tag: 'cappM', cv: 'capp', t: 'Cappelletti: both majors (5-4 or longer)' });
        add(B(2, 2), h => h.len[2] >= 5 && Math.max(h.len[0], h.len[1]) >= 4 && h.hcp >= 8, { min: 8, len: { 2: 5 }, tag: 'cappH', cv: 'capp', t: 'Cappelletti: 5+ ♥ and a 4+ minor' });
        add(B(2, 3), h => h.len[3] >= 5 && Math.max(h.len[0], h.len[1]) >= 4 && h.hcp >= 8, { min: 8, len: { 3: 5 }, tag: 'cappS', cv: 'capp', t: 'Cappelletti: 5+ ♠ and a 4+ minor' });
        add(B(2, 0), h => Math.max(...h.len) >= 6 && h.hcp >= 8 && h.top5(h.longest) >= 2, { min: 8, tag: 'capp1', cv: 'capp', t: 'Cappelletti: a one-suiter (6+)' });
        add('P', () => true, { t: 'Pass' });
        return L;
      }

      for (const s of [3, 2, 1, 0]) { const l = cheap(s); if (l <= 3) add(B(l, s), h => h.len[s] >= (l === 2 ? 5 : 6) && h.hcp >= 8 - d && h.hcp <= 15 && h.top5(s) >= 2, { min: 8 - d, max: 15, len: { [s]: 5 }, t: 'Natural: 5+ ' + SUIT[s] + ', 8-15 HCP' }); }
      add('P', () => true, { t: 'Pass' });
      return L;
    }
    const unbid = [0, 1, 2, 3].filter(s => !x.oppSuits.includes(s));
    if (C.michaels && LV(ob) === 1 && x.oppBids.length === 1 && !bal4) {
      if (os < 2) add(B(2, os), h => h.len[2] >= 5 && h.len[3] >= 5 && h.hcp >= 7, { min: 7, len: { 2: 5, 3: 5 }, tag: 'mich', cv: 'michaels', t: 'Michaels cue bid: both majors (5-5)' });
      else { const M = otherMajor(os); add(B(2, os), h => h.len[M] >= 5 && Math.max(h.len[0], h.len[1]) >= 5 && h.hcp >= 7, { min: 7, len: { [M]: 5 }, tag: 'mich', major: M, cv: 'michaels', t: 'Michaels cue bid: 5+ ' + SUIT[M] + ' and a 5+ minor' }); }
      const lw = unbid.slice().sort((a, b) => a - b).slice(0, 2);
      add(B(2, 4), h => h.len[lw[0]] >= 5 && h.len[lw[1]] >= 5 && h.hcp >= 7, { min: 7, len: { [lw[0]]: 5, [lw[1]]: 5 }, tag: 'unusual', suits: lw, cv: 'michaels', t: 'Unusual 2NT: ' + SUIT[lw[0]] + ' and ' + SUIT[lw[1]] + ' (5-5)' });
    }
    if (LV(ob) === 1) add(B(1, 4), h => h.bal && h.hcp >= 15 - d && h.hcp <= 18 && h.stop(os), { min: 15 - d, max: 18, len: BAL, t: 'Balanced 15-18 HCP with a stopper in their suit', tag: 'nt1' });
    add('X', h => h.hcp >= 17, { min: 17, cv: 'takeout', t: 'Strong hand: 17+ HCP' });
    for (const s of [3, 2, 1, 0]) {
      if (x.oppSuits.includes(s)) continue; const l = cheap(s);
      if (l + 1 <= 3) add(B(l + 1, s), h => !bal4 && h.len[s] >= 6 && h.hcp >= 5 && h.hcp <= 10 && h.top5(s) >= 2, { min: 5, max: 10, len: { [s]: 6 }, t: 'Weak jump overcall: 6+ ' + SUIT[s] + ', 5-10 HCP' });
    }
    for (const s of [3, 2, 1, 0]) {
      if (x.oppSuits.includes(s)) continue; const l = cheap(s);
      const mn = (l === 1 ? 8 : l === 2 ? 11 : 13) - d;
      add(B(l, s), h => h.len[s] >= (l === 3 ? 6 : 5) && h.hcp >= mn && h.hcp <= 16 && (l === 1 || h.top5(s) >= 2) && h.len[s] >= Math.max(...unbid.map(u => h.len[u])), { min: mn, max: 16, len: { [s]: 5 }, t: 'Overcall: 5+ ' + SUIT[s] + ', ' + mn + '-16 HCP' });
    }
    add('X', h => h.hcp >= 12 - d && h.len[os] <= 2 && unbid.every(u => h.len[u] >= 3 || (h.len[u] >= 2 && h.hcp >= 15)), { min: 12 - d, len: Object.fromEntries(unbid.map(u => [u, 3])), cv: 'takeout', t: 'Takeout double: 12+ HCP, support for the unbid suits' });

  }

  /* ===== partner opened, my first action ===== */

      add(B(1, 4), h => h.bal && h.hcp >= 8 && h.hcp <= 13, { min: 8, max: 13, cv: 'sys', f: 1, t: 'Positive: balanced, 8-13 HCP' });
      for (const s of [0, 1]) add(B(2, s), h => h.hcp >= 8 && h.len[s] >= 5, { min: 8, len: { [s]: 5 }, cv: 'sys', f: 1, gf: pol ? 0 : 1, t: 'Positive: 5+ ' + SUIT[s] + ', 8+ HCP' });
      add(B(2, 4), h => h.bal && h.hcp >= 14, { min: 14, cv: 'sys', f: 1, gf: 1, t: 'Positive: balanced, 14+ HCP' });
      add(B(1, 1), () => true, { max: pol ? 11 : 7, tag: 'neg', cv: 'sys', f: 1, t: pol ? 'Polish 1♦: negative (0-7) or a waiting bid' : 'Precision 1♦: negative, 0-7 HCP (artificial)' });
      return L;
    }

    if (o === B(2, 1) && otag === 'multi' && rhoPass && fresh) {
      add(B(2, 4), h => h.hcp >= 15, { min: 15, tag: 'mask', cv: 'sys', f: 1, t: 'Asking: which major is it?' });
      add(B(2, 2), () => true, { tag: 'mpoc', cv: 'sys', t: 'Pass or correct: pass with hearts, bid 2♠ with spades' });
      return L;
    }
    // SEF 2♦ (artificial game force): 2♥ is the waiting reply
    if (o === B(2, 1) && otag === '2c' && x.sys.k === 'sef' && rhoPass && fresh) {
      for (const s of [3, 0, 1]) add(B(s === 3 ? 2 : 3, s), h => h.hcp >= 7 && h.len[s] >= 5 && h.top5(s) >= 2, { min: 7, len: { [s]: 5 }, cv: 'sys', t: 'Positive: 5+ ' + SUIT[s] + ', 7+ HCP' });
      add(B(2, 2), () => true, { cv: 'sys', tag: 'relay', t: 'Waiting reply (artificial)' });
      return L;
    }
    if ((o === B(1, 4) || o === B(2, 4)) && rhoPass && fresh) { ntResponses(x, add, ol, true); return L; }
    // Texas after interference: 4♦/4♥ stay transfers over a double or a 2-3 level overcall (not in their own suit)
    if (o === B(1, 4) && opening === pLast && pJust && C.texas && C.texasInt && (x.rhoCall === 'X' || (isNum(x.rhoCall) && LV(x.rhoCall) <= 3 && ST(x.rhoCall) < 4))) {
      const obs = isNum(x.rhoCall) ? ST(x.rhoCall) : -1;

/* Notrump ranges other than 15-17 (Acol 12-14, Precision 13-15): the 15-17 rules are used with every hand moved
   by the difference d — the responder counts d points less, the opener d points more — and the ranges in the
   meanings (and their texts) are moved back. */
function shiftAdd(add, d, resp) {
  if (!d) return add;
  const sh = h => Object.assign(Object.create(h), { hcp: h.hcp + (resp ? -d : d) });
  const fix = m => {
    if (!m || !resp) return m;
    const n = { ...m }; if (n.min != null) n.min += d; if (n.max != null) n.max += d;
    if (n.t) n.t = n.t.replace(/(\d+)-(\d+) HCP/g, (_, a, b) => (+a ? +a + d : 0) + '-' + (+b + d) + ' HCP').replace(/(\d+)\+ HCP/g, (_, a) => (+a + d) + '+ HCP');
    return n;
  };
  return (c, t, m) => add(c, h => t(sh(h)), fix(m));
}

/* ---- responses after RHO overcalls partner's one-suit opening ---- */

function mergeCloud(recs, settings) {

/* ================= virtual field (background worker) ================= */
/* the virtual field: 10 expert robot tables play the same deal in two background workers;
   double-dummy checks run in a third worker that is restarted for every new board, so nothing waits behind an old job */
const FIELD_N = 10, FIELD_PARTS = 2;
const Field = {
  live: {}, fw: [], dw: null, ddBoard: null, src: null,
  mk() {
    try {
      if (!this.src) this.src = URL.createObjectURL(new Blob(['const E={};\n' + window.BRIDGE.map(f => '(' + f.toString() + ')(E);').join('\n') + '\n(' + E.workerMain.toString() + ')(E);'], { type: 'text/javascript' }));
      const w = new Worker(this.src);
      w.onmessage = e => this.onmsg(e.data);
      return w;
    } catch (e) { return null; }
  },
  init() {},
  start(g) {
    const f = { tables: [], n: FIELD_N, done: false, dd: {}, normC: null, parts: 0, t0: Date.now() };
    g.field = f; this.live[g.id] = { f, deal: g.deal, board: g.board };
    this.fw.forEach(w => w && w.terminate()); this.fw = [];
    const per = Math.ceil(FIELD_N / FIELD_PARTS);
    for (let p = 0; p < FIELD_PARTS; p++) {
      const w = this.mk(), msg = { type: 'field', id: g.id, deal: g.deal, board: g.board, cards: g.cards, from: p * per, to: Math.min(FIELD_N, (p + 1) * per) };
      if (!w) { this.fallback(msg); continue; }
      w.onerror = () => this.partDone(g.id);
      this.fw.push(w); w.postMessage(msg);
    }
    // safety net: if a worker is stopped by the phone, finish with the tables we have
    clearTimeout(this.watch); this.watch = setTimeout(() => { const L = this.live[g.id]; if (L && !L.f.done) { L.f.parts = FIELD_PARTS - 1; this.partDone(g.id); } }, 6 * 60000);
  },
  partDone(id) {
    const L = this.live[id]; if (!L || L.f.done) return;
    if (++L.f.parts >= FIELD_PARTS) this.onmsg({ type: 'fieldDone', id });
  },
  dd(id, key, deal, c) {
    if (this.ddBoard !== id || !this.dw) { if (this.dw) this.dw.terminate(); this.dw = this.mk(); this.ddBoard = id; if (this.dw) this.dw.onerror = () => this.onmsg({ type: 'dd', id, key, t: null }); }
    if (this.dw) this.dw.postMessage({ type: 'dd', id, key, deal, c, limit: 4e7 });
    else setTimeout(() => this.onmsg({ type: 'dd', id, key, t: E.ddContract(deal, c, 1.5e6) }), 50);
  },
  fallback(msg) {
    let i = msg.from;
    const step = () => {
      if (i >= msg.to) { this.partDone(msg.id); return; }
      const r = E.simulateTable(msg.deal, msg.board, msg.cards, E.FIELD_AGG[i % E.FIELD_AGG.length]);
      this.onmsg({ type: 'table', id: msg.id, i, r }); i++; setTimeout(step, 30);
    };
    setTimeout(step, 500);
  },
  onmsg(m) {
    const L = this.live[m.id]; if (!L) return; const f = L.f;
    if (m.type === 'table') f.tables.push(m.r);
    if (m.type === 'part') { this.partDone(m.id); return; }
    if (m.type === 'fieldDone' && !f.done) {
      f.done = true;
      const cnt = {}; let best = null;
      for (const t of f.tables) { if (t.passed) continue; const k = conId(t.c); cnt[k] = (cnt[k] || 0) + 1; if (!best || cnt[k] > cnt[conId(best)]) best = t.c; }
      f.normC = best;
      if (best) this.dd(m.id, 'norm', L.deal, best);

      if (e) { applyField(e, f); Store.saveRec(e); scheduleSync(); }
    }
    if (m.type === 'dd') { f.dd[m.key] = m.t; const e = HIST.find(h => h.id === m.id); if (e) e.dd = { ...f.dd }; }
    if (m.type === 'error') this.partDone(m.id);
    if (G && G.id === m.id) { save(); if (ui.overlay === 'end') showEnd(); if (G.phase === 'done') render(); else renderBar(); }
  },
};
function applyField(e, f) {
  if (!f || !f.done || !f.tables.length) return;

/* a never-seen deal; in practice mode, one where our side gets to use the chosen convention */
function freshDeal(dealer) {
  const want = SET.practice, cards = sideCards(), t0 = performance.now();
  let fallback = null;
  for (let i = 0; i < 20000; i++) {
    const d = E.shuffle([...Array(52).keys()]);
    const deal = [0, 1, 2, 3].map(k => d.slice(k * 13, k * 13 + 13));
    const key = E.dealKey(deal);
    if (SEEN.has(key)) continue;
    if (want) {
      const auc = [];
      while (!auctionOver(auc) && auc.length < 60) { const t = (dealer + auc.length) % 4; const r = E.aiBid(auc, t, deal[t], cards); auc.push({ seat: t, call: r.call, m: r.m }); }
      const mine = auc.some(e => e.seat === U() && e.m && e.m.cv === want);
      const ours = auc.some(e => sideOf(e.seat) === sideOf(U()) && e.m && e.m.cv === want);
      if (!mine && !ours) { if (performance.now() - t0 < 4000) continue; }
      else if (!mine) { if (!fallback) fallback = { deal, key }; if (performance.now() - t0 < 2500) continue; }
      if (!mine && !ours && fallback) { SEEN.add(fallback.key); saveSeen(); return fallback.deal; }
      if (!mine && !ours) flash('No practice deal found quickly — here is a normal deal', 2500);
    }
    SEEN.add(key); saveSeen(); return deal;
  }
  throw new Error('could not find an unseen deal');
}

/* ---- entering a deal (hand record, PBN, or the code Claude reads from a photo) ---- */
const RANKS = { A: 12, K: 11, Q: 10, J: 9, T: 8, '9': 7, '8': 6, '7': 5, '6': 4, '5': 3, '4': 2, '3': 1, '2': 0 };
/* "AKQ2.K73.J5.T942" (spades.hearts.diamonds.clubs) or "S AKQ2 H K73 D J5 C T942" / "♠AKQ2 ♥K73 …" */
function parseHand(txt) {
  txt = String(txt || '').toUpperCase().replace(/10/g, 'T').trim();
  if (!txt) return null;
  const out = [], put = (s, str) => { for (const ch of str.replace(/[^AKQJT2-9]/g, '')) out.push(s * 13 + RANKS[ch]); };
  if (txt.includes('.')) { const parts = txt.split('.'); if (parts.length !== 4) throw new Error('Use four groups separated by dots: spades.hearts.diamonds.clubs'); [3, 2, 1, 0].forEach((s, i) => put(s, parts[i])); }
  else {
    const map = { S: 3, '♠': 3, H: 2, '♥': 2, D: 1, '♦': 1, C: 0, '♣': 0 };
    const re = /([SHDC♠♥♦♣])\s*:?\s*([AKQJT2-9\-—]*)/g; let m, any = false;

/* replay of a finished board, one card at a time: ui.revStep cards have been played.
   The hands sit round the table (you at the bottom) and the current trick lies in the middle. */
function revPlayHtml(e) {
  const flat = e.pl.flat(), n = flat.length, k = Math.max(0, Math.min(ui.revStep || 0, n));
  const trump = e.c.strain < 4 ? e.c.strain : -1, decl = sideOf(e.c.decl);
  const win = t => E.trickWinner(t.map(([s, c]) => ({ s, c })), trump);
  const played = new Set(flat.slice(0, k).map(x => x[1]));
  const ti = k ? Math.floor((k - 1) / 4) : -1, trick = ti < 0 ? [] : e.pl[ti].slice(0, k - ti * 4);
  let t1 = 0, t2 = 0;
  for (let i = 0; i < e.pl.length && (i + 1) * 4 <= k; i++) { if (sideOf(win(e.pl[i])) === decl) t1++; else t2++; }
  const w = trick.length === 4 ? win(trick) : -1, next = k < n ? flat[k][0] : -1;
  const pos = ['s', 'w', 'n', 'e'], rel_ = s => (s - e.seat + 4) % 4;
  const hand = s => {
    const left = e.deal[s].filter(c => !played.has(c));
    const tag = s === e.c.decl ? ' · Decl' : s === pd(e.c.decl) ? ' · Dummy' : '';
    return `<div class="h ${pos[rel_(s)]}${s === next ? ' turn' : ''}"><b>${SEAT[s]}${s === e.seat ? ' (you)' : ''}${tag}</b>${ORDER.map(su => { const cs = E.desc(E.inSuit(left, su)); return `${symHtml(su)} ${cs.length ? cs.map(c => RTXT[R(c)]).join(' ') : '—'}`; }).join('<br>')}</div>`;
  };
  const mid = `<div class="rtrick" data-rs="next">${trick.map(([s, c]) => `<span class="rc ${pos[rel_(s)]}${s === w ? ' win' : ''}">${RTXT[R(c)]}${symHtml(S(c))}</span>`).join('')}</div>`;
  const status = k === 0 ? `Opening lead: ${SEAT[next]}` : k >= n ? `End of play · declarer ${t1}, defence ${t2}${n < 52 ? ' · the rest was claimed' : ''}`
    : `Trick ${ti + 1} of ${e.pl.length} · declarer ${t1}, defence ${t2}${w >= 0 ? ` · won by ${SEAT[w]}` : ''}`;
  return `<div class="deal replay">${[0, 1, 2, 3].map(hand).join('')}${mid}</div>
    <div class="rstat">${status}</div>
    <div class="rctl"><button class="btn" data-rs="first" ${k ? '' : 'disabled'}>⏮</button><button class="btn" data-rs="prev" ${k ? '' : 'disabled'}>◀</button>
      <button class="btn gold" data-rs="auto">${ui.revTimer ? 'Pause' : 'Play'}</button>
      <button class="btn" data-rs="next" ${k < n ? '' : 'disabled'}>▶</button><button class="btn" data-rs="last" ${k < n ? '' : 'disabled'}>⏭</button></div>`;
}
function revStep(a) {
  const e = HIST.find(h => h.id === ui.revId); if (!e || !e.pl) return;
  const n = e.pl.flat().length, k = ui.revStep || 0;
  if (a === 'auto') { if (ui.revTimer) stopRev(); else { if (k >= n) ui.revStep = 0; ui.revTimer = setInterval(() => { if ((ui.revStep || 0) >= n || ui.overlay !== 'rev') { stopRev(); return; } ui.revStep++; revDraw(); }, 900); } }

  const obj20 = o => { const r = {}; for (const k in (o || {})) r[String(k).slice(0, 40)] = String(o[k]).slice(0, 20); return r; };
  function cleanTour(t) {

      if (d.tok && (st.banned || []).includes(d.tok)) { conn.send({ t: 'kick' }); setTimeout(() => conn.close(), 500); return; }
      // spectators: a solo table cannot be watched; a spectator who comes back is let in again at once
      if (d.want === 'watch' && !st.host) { try { conn.send({ t: 'declined' }); } catch (e) {} return; }
      if (d.want === 'watch' && d.tok && (st.watchToks || []).includes(d.tok)) { addWatcher(conn, d); return; }
      const away = st.away || (st.away = {});
      // a player coming back after a dropped connection gets the seat that was kept for them
      // (recognised by the device token, even before this side has noticed the old connection died)
      const toks = st.toks || (st.toks = {});
      const byTok = d.tok ? Object.keys(toks).find(k => toks[k] === d.tok && st.seats[k] && st.seats[k] !== 'host') : null;
      const back = byTok != null ? +byTok : d.seat != null && away[d.seat] ? +d.seat : null;
      // a new player waits until the host accepts them
      if (back == null) {
        if (nameTaken(d.name)) { conn.send({ t: 'nametaken' }); setTimeout(() => conn.close(), 500); return; }
        // someone you invited sits down at once; a private table turns away anyone else
        const inv = (st.invited || []).includes(nameKey(d.name));
        if (inv && st.host && d.want !== 'watch') { st.invited = st.invited.filter(x => x !== nameKey(d.name)); seatPlayer(conn, d, null); return; }
        if (st.priv && st.host && !inv) { try { conn.send({ t: 'declined' }); } catch (e) {} return; }
        (st.pending || (st.pending = {}))[conn.peer] = { conn, d };
        conn.send({ t: 'wait' });
        conn.on('close', () => { if (st.pending && st.pending[conn.peer]) { delete st.pending[conn.peer]; reqRefresh(); render(); } });
        showReq(); beep();
        return;
      }
      seatPlayer(conn, d, back);
      return;
    }
    // a spectator may only chat
    const wt = st.watch && st.watch.get(conn.peer);
    if (wt) { if (d.t === 'chat') addChat(wt.name + ' 👁', d.text); if (d.t === 'leave') { st.watch.delete(conn.peer); addChat(null, wt.name + ' stopped watching'); broadcast(); panelRefresh(); render(); } return; }
    const seat = seatOf(conn.peer); if (Number.isNaN(seat)) return;
    // a guest asks for a new deal during play, or for the table score to be reset: the host decides
    if (d.t === 'ndreq' || d.t === 'rsreq') { (st.asks || (st.asks = {}))[conn.peer] = { kind: d.t === 'ndreq' ? 'nd' : 'rs', seat }; flash((st.names[seat] || SEAT[seat]) + ' ' + T(d.t === 'ndreq' ? 'asks for a new deal' : 'asks to reset the table score'), 3000); panel(); render(); return; }
    const who = st.names[seat] || SEAT[seat];
    if (d.t === 'leave') { delete st.seats[seat]; delete st.names[seat]; if (st.toks) delete st.toks[seat]; if (st.away && st.away[seat]) { clearTimeout(st.away[seat].t); delete st.away[seat]; } st.conns.delete(conn.peer); addChat(null, who + ' left the table — a robot plays ' + SEAT[seat]); broadcast(); panelRefresh(); render(); tick(); return; }
    if (d.t === "chat") { addChat(who, d.text); return; }
    if (d.t === "undo") { requestUndo(conn.peer, who, seat); return; }   // the other side may say no
    if (d.t === "claim") { if (G.phase === "play" && !G.play.trick.length && owner(G.play.turn) === conn.peer) { const left = G.play.hands[G.play.turn].length, n = Number.isFinite(+d.n) ? Math.max(0, Math.min(+d.n, left)) : left; requestClaim(G.play.turn, n, who); } return; }
    if (d.t === "askreply") { const f = askP[d.id]; if (f && f.who.includes(conn.peer)) f.fin(!!d.ok); return; }
    if (d.t === "replay") { if (G.phase === "done") { addChat(null, who + " asked to replay this deal"); replayDeal(); } return; }
    if (d.t === "hint") { if (G.phase === "play" && owner(G.play.turn) === conn.peer && G.play.trick.length < 4) conn.send({ t: "hint", c: E.aiPlay(G.play, G.play.turn), id: G.id }); return; }
    if (d.t === "call" && G.phase === "bid" && owner(bidTurn()) === conn.peer) makeCall(bidTurn(), d.call);
    else if (d.t === 'card' && G.phase === 'play' && owner(G.play.turn) === conn.peer) playCard(G.play.turn, d.c);
    else if (d.t === 'next' && G.phase === 'done') nextDeal();
  }
  // a guest's connection dropped: a robot plays the seat at once, and the seat is kept for them for 10 minutes
  // (they get it back without asking when they return)
  function drop(conn) {
    const wt = st.watch && st.watch.get(conn.peer);
    if (wt && wt.conn === conn) { st.watch.delete(conn.peer); addChat(null, wt.name + ' stopped watching'); broadcast(); panelRefresh(); render(); return; }
    if (st.conns.get(conn.peer) !== conn) return;
    const s = Object.keys(st.seats).find(k => st.seats[k] === conn.peer);
    st.conns.delete(conn.peer);
    if (s == null || !st.host) return;
    const away = st.away || (st.away = {}), who = st.names[s] || SEAT[s];
    if (st.moves) delete st.moves[conn.peer];
    addChat(null, who + ' lost the connection — a robot plays ' + SEAT[s] + ' until they are back');
    away[s] = { t: setTimeout(() => {
      if (!away[s] || st.seats[s] !== conn.peer) return;
      delete away[s]; delete st.seats[s]; delete st.names[s]; if (st.toks) delete st.toks[s];
      addChat(null, who + ' did not come back — the seat is free');
      broadcast(); panelRefresh(); render(); tick();
    }, 600000) };
    broadcast(); panelRefresh(); render(); tick();
  }
  // the host answers a request to change seats
  function moveAnswer(id, ok) {
    const m = st.moves && st.moves[id]; if (!m) return; delete st.moves[id];
    const c = st.conns.get(id);
    if (ok && !st.seats[m.to] && st.seats[m.from] === id && G && (G.phase === 'lobby' || G.phase === 'done')) {
      const from = m.from, to = m.to;
      st.seats[to] = st.seats[from]; st.names[to] = st.names[from]; delete st.seats[from]; delete st.names[from];
      const toks = st.toks || {}; if (toks[from]) { toks[to] = toks[from]; delete toks[from]; }
      try { c && c.send({ t: 'seat', seat: to }); } catch (e) {}
      addChat(null, st.names[to] + ' moved to ' + SEAT[to]);
    } else { try { c && c.send({ t: 'movedeclined' }); } catch (e) {} }
    broadcast(); panelRefresh(); render(); tick();
  }
  function stop() {
    if (st.seatBak != null) { SET.seat = st.seatBak; st.seatBak = null; } st.tour = null; st.invSeat = {};
    for (const c of st.conns.values()) { try { c.send({ t: 'bye' }); } catch (e) {} }
    for (const w of (st.watch || new Map()).values()) { try { w.conn.send({ t: 'bye' }); } catch (e) {} setTimeout(() => { try { w.conn.close(); } catch (e) {} }, 500); }
    st.watch = new Map(); st.watchToks = []; st.priv = false; st.invited = [];
    for (const a of Object.values(st.away || {})) clearTimeout(a.t); st.away = {};
    const cs = [...st.conns.values()];   // close a moment later so the goodbye arrives first (the room address is kept)
    setTimeout(() => { for (const c of cs) { try { c.close(); } catch (e) {} } }, 500);
    wakeOff();
    Object.assign(st, { on: false, host: false, guest: false, me: 'local', peer: null, conn: null, conns: new Map(), seats: {}, names: {}, ctl: null, code: null, msg: '' });
    if (G && G.phase === "lobby") { G = idleG(); render(); return; }   // nobody started: back to the start screen
    render(); tick();
  }

  /* ---- guest ---- */
  // retry: reconnecting after a dropped connection (screen locked, app switched, network blip) — same seat, no join screen
  async function join(code, name, want, retry) {
    setName(name);
    if (!retry) { st.msg = 'Connecting to table ' + code + '…'; showJoin(code); }
    try {
      await loadLib();
      const peer = await new Promise((res, rej) => { const p = new Peer(); p.on('open', () => res(p)); p.on('error', e => rej(new Error('Could not reach the connection service (' + (e.type || 'error') + ').'))); });
      const conn = peer.connect(PREFIX + code, { reliable: true });
      st.joinPeer = peer;
      let welcomed = false, failed = false, waiting = false;
      const fail = msg => { if (welcomed || failed) return; failed = true; try { peer.destroy(); } catch (e) {} if (retry) { retry(false); return; } forgetTable(); st.msg = msg; showJoin(code); };
      setTimeout(() => { if (!welcomed && !waiting) fail('The table could not be reached. Check the link, and that the host still has the app open. Some mobile networks block direct connections — try Wi-Fi.'); }, retry ? 8000 : 15000);
      peer.on('error', e => { if (e.type === 'peer-unavailable') fail('That table is not open any more.'); });
      peer.on('disconnected', () => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} });
      conn.on('open', () => conn.send({ t: 'hello', name, want, tok: devTok(), prof: prof(), seat: retry ? st.seat : undefined }));
      conn.on('data', d => {
        if (!d) return;
        if (d.t === 'welcome') {
          welcomed = true; clearTimeout(timer);
          st.waiting = false; st.watching = !!d.watch;
          rememberTable({ code, name, want, watch: !!d.watch });
          Object.assign(st, { peer, conn, on: true, guest: true, host: false, me: peer.id, seat: d.seat, code, msg: "", savedG: st.savedG || (G && G.phase === "idle" ? ui.saved : G), chat: d.chat || st.chat || [], unread: 0, rejoin: { code, name, want } });
          if (retry) retry(true); else closeOv();
          wakeOn(); ping();
        } else if (d.t === 'state') applyState(d.v);
        else if (d.t === "full") fail("That table is full.");
        else if (d.t === "chat") gotChat(d.m);
        else if (d.t === "seat") { st.seat = d.seat; render(); }
        else if (d.t === "askno") flash(T('The host said no'), 2500);
        else if (d.t === "ask") { st.askId = d.id; askLocal(d.a || {}, ok => { send({ t: 'askreply', id: d.id, ok }); closeOv(); }); }
        else if (d.t === "askdone") { if (st.askId === d.id && ui.overlay === 'ask') closeOv(); }
        else if (d.t === "movedeclined") flash('The host did not agree to the move', 2500);
        else if (d.t === "wait") { waiting = true; st.waiting = true; st.msg = 'Waiting for the host to accept you…'; showJoin(code); }
        else if (d.t === "nametaken") { waiting = false; st.waiting = false; failed = true; try { peer.destroy(); } catch (e) {} st.msg = 'The name ' + name + ' is already used at this table. Choose another name.'; showJoin(code); }
        else if (d.t === "declined") { waiting = false; st.waiting = false; failed = true; try { peer.destroy(); } catch (e) {} st.msg = 'The host did not accept the request.'; showJoin(code); }
        else if (d.t === "kick") { st.rejoin = null; if (st.guest) leave('The host removed you from the table.'); else { st.msg = 'The host removed you from this table.'; showJoin(code); } }
        else if (d.t === "bye") { st.rejoin = null; if (st.guest) leave('The host closed the table.'); }
        else if (d.t === "hint" && G && d.id === G.id && G.phase === "play") { ui.hintCard = d.c; render(); }
      });
      conn.on('close', () => { if (st.guest && st.conn === conn) lost(); });
    } catch (e) { if (retry) retry(false); else { st.msg = e.message; showJoin(code); } }
  }
  /* the table you sit at is remembered on the device: if the app is closed or the phone drops out, opening
     the app again takes you straight back to the same table and seat (the host knows you by your device id) */
  const LAST_KEY = 'bridge-last-table';
  function rememberTable(t) { try { localStorage.setItem(LAST_KEY, JSON.stringify({ ...t, ts: Date.now() })); } catch (e) {} }
  function forgetTable() { try { localStorage.removeItem(LAST_KEY); } catch (e) {} }
  function touchTable() { try { const t = JSON.parse(localStorage.getItem(LAST_KEY) || 'null'); if (t && Date.now() - t.ts > 30000) { t.ts = Date.now(); localStorage.setItem(LAST_KEY, JSON.stringify(t)); } } catch (e) {} }
  function autoRejoin() {
    if (st.on || st.waiting || /#join-/.test(location.hash)) return;
    let t = null; try { t = JSON.parse(localStorage.getItem(LAST_KEY) || 'null'); } catch (e) {}
    if (!t || !t.code) return;
    if (Date.now() - t.ts > 10 * 60000) { forgetTable(); return; }   // the host keeps a seat for 10 minutes
    st.want = t.watch ? 'watch' : t.want || 'partner'; st.offer = null;
    flash(T('Going back to your table…'), 2500);
    join(t.code, t.name, st.want);
  }
  // the connection dropped: keep the table on screen and try to get back in for two minutes
  function lost() {
    if (st.reconnecting || !st.rejoin) { if (!st.reconnecting) leave('The connection to the table was lost.'); return; }
    st.reconnecting = true; st.conn = null;
    const until = Date.now() + 120000, r = st.rejoin;
    const tryOnce = () => {
      if (!st.guest || st.rejoin !== r) { st.reconnecting = false; return; }
      if (Date.now() > until) { st.reconnecting = false; leave('Could not get back to the table. Open the invite link again to rejoin.'); return; }
      flash('Connection lost — reconnecting…', 2500);
      try { st.peer && st.peer.destroy(); } catch (e) {}
      join(r.code, r.name, r.want, ok => { if (ok) { st.reconnecting = false; flash('Back at the table', 1500); } else setTimeout(tryOnce, 2500); });
    };
    tryOnce();
  }
  // a small message every 10 s keeps mobile networks from closing an idle connection
  let pingT = null;
  function ping() {
    clearInterval(pingT);
    pingT = setInterval(() => {
      if (st.guest) { if (st.conn && st.conn.open) { try { st.conn.send({ t: 'ping' }); } catch (e) {} } }
      else if (st.host) { for (const c of st.conns.values()) if (c.open) { try { c.send({ t: 'ping' }); } catch (e) {} } }
      else clearInterval(pingT);
    }, 10000);
  }
  // back from the lock screen or another app: reconnect at once if the line went dead meanwhile
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (st.guest && !st.reconnecting && !(st.conn && st.conn.open)) lost();
    if ((st.guest || st.host) && (!st.wake || st.wake.released)) wakeOn();
    if (st.host && st.peer && st.peer.disconnected && !st.peer.destroyed) { try { st.peer.reconnect(); } catch (e) {} }
  });
  function applyState(v) {
    clearTimeout(timer);
    if (v.phase !== "done") HIST = HIST.filter(h => !(h.id === v.id && h.online)); // a finished board was taken back
    st.ctl = v.ctl; st.names = v.names || {}; st.score = v.score || null;
    touchTable();
    G = v;
    if (G.phase === 'done' && G.result) {
      // keep the board in your own results and statistics
      let e = HIST.find(h => h.id === G.id);
      if (!e) {
        const r = G.result; e = { ...r, seat: st.seat, us: sideOf(st.seat) === 0 ? r.ns : -r.ns, imp: null, mp: null, online: true };
        HIST.push(e); SEEN.add(E.dealKey(G.deal)); saveSeen();
      }
      if (e.imp == null && G.field && G.field.done) applyField(e, G.field);
      Store.saveRec(e); save();
    }
    render();
    if (ui.overlay === 'end') showEnd();
  }
  function leave(msg) {
    forgetTable();
    // leave the table first, then close the line: closing can report "connection lost" at once, and that
    // must not start a reconnection
    const c = st.conn, p = st.peer, back = st.savedG;
    Object.assign(st, { on: false, guest: false, me: 'local', peer: null, conn: null, ctl: null, names: {}, code: null, savedG: null, rejoin: null, reconnecting: false, watching: false });
    try { if (c && c.open && !msg) c.send({ t: 'leave' }); } catch (e) {}   // tell the host, so the seat is freed at once
    setTimeout(() => { try { c && c.close(); } catch (e) {} try { p && p.destroy(); } catch (e) {} }, 300);
    wakeOff();
    G = back && back.phase !== "lobby" ? back : idleG(); render(); tick();
    if (msg) flash(msg, 3000);
  }

  /* ---- chat (the host relays every message to the whole table) ---- */
  const myTableName = () => st.names[st.guest ? st.seat : SET.seat] || myName() || 'Me';
  function addChat(from, text) {
    text = String(text || '').trim().slice(0, 200); if (!text || !st.host) return;
    const m = { from, text, ts: Date.now() };
    st.chat.push(m); if (st.chat.length > 200) st.chat.shift();
    for (const c of st.conns.values()) if (c.open) { try { c.send({ t: 'chat', m }); } catch (e) {} }
    gotChat(m, true);
  }
  function gotChat(m, mine) {
    if (!mine) { st.chat.push(m); if (st.chat.length > 200) st.chat.shift(); }
    if (typeof renderDock === 'function') renderDock();
    if (ui.overlay === 'chat') { chatPanel(); return; }
    if (m.from !== myTableName() && !(ui.dockOpen || dockWide())) { st.unread++; flash((m.from ? m.from + ': ' : '') + m.text, 2600); }
    renderBar();
  }
  function sendChat(text) {
    text = String(text || '').trim(); if (!text) return;
    if (st.host) addChat(myTableName(), text); else send({ t: 'chat', text });
  }
  const QUICK = ['Hi!', 'Well played', 'Thanks partner', 'Sorry partner', 'Good luck', 'Ready?', 'One more?', '👍', '😂', '🙈'];
  // the table chat as a list (for the chat column)
  function tchatHtml() {
    const t = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return st.chat.slice(-80).map(m => m.from ? `<div class="cm${m.from === myTableName() ? ' me' : ''}"><b>${esc(m.from)}</b> ${esc(m.text)}<small>${t(m.ts)}</small></div>` : `<div class="cm sys">${esc(m.text)}<small>${t(m.ts)}</small></div>`).join('') || `<div class="muted">${T('No messages yet — say hello!')}</div>`;
  }
  function chatPanel() {
    const draft = document.getElementById('nMsg'); if (draft) st.draft = draft.value;
    st.unread = 0;
    const t = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const list = st.chat.slice(-60).map(m => m.from ? `<div class="cm${m.from === myTableName() ? ' me' : ''}"><b>${esc(m.from)}</b> ${esc(m.text)}<small>${t(m.ts)}</small></div>` : `<div class="cm sys">${esc(m.text)}<small>${t(m.ts)}</small></div>`).join('') || '<div class="muted">No messages yet — say hello!</div>';
    openOv('chat', `<h2>Table chat</h2><div class="chatlist" id="nList">${list}</div>
      <div class="quick">${QUICK.map(q => `<button data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <div class="row2"><input class="tok" id="nMsg" maxlength="200" placeholder="Write a message…" value="${esc(st.draft || '')}"><button class="btn gold" id="nSend">Send</button></div>
      <div class="row2"><button class="btn" id="oClose">Close</button></div>`);
    const L = document.getElementById('nList'); if (L) L.scrollTop = L.scrollHeight;
    renderBar();
  }

  /* ---- questions to players (a claim, a robot claim, an undo): the first answer decides; no answer in 90 s = no.
     "host" is this device (asked on screen), other owners are asked over their line. ---- */
  const askP = {};
  function askOwners(owners, a) {
    return new Promise(res => {
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      let done = false;
      const fin = ok => { if (done) return; done = true; delete askP[id]; if (ui.overlay === 'ask') closeOv(); for (const o of owners) { const c = st.conns.get(o); if (c && c.open) { try { c.send({ t: 'askdone', id }); } catch (e) {} } } res(ok); };
      askP[id] = { fin, who: owners };
      for (const o of owners) {
        if (o === 'host' || o === 'local') askLocal(a, fin);
        else { const c = st.conns.get(o); if (c && c.open) { try { c.send({ t: 'ask', id, a }); } catch (e) {} } }
      }
      setTimeout(() => fin(false), 90000);
    });
  }

  /* ---- table score (NS against EW, points of every board played at this online table) ---- */
  function boardDone(e) {
    if (!st.host || !e) return;
    const s = st.score || (st.score = { ns: 0, ew: 0, n: 0 });
    if (e.ns > 0) s.ns += e.ns; else s.ew -= e.ns || 0;
    s.n++; broadcast();
  }
  function scoreHtml() {
    const s = st.score; if (!st.on) return '';
    const line = s ? `NS <b>${s.ns}</b> – EW <b>${s.ew}</b> · ${s.n} ${T('boards')}` : '—';
    const btns = st.host ? `<button class="btn" id="nRst">${T('Reset the score')}</button>`
      : st.watching ? '' : `<button class="btn" id="nRstQ">${T('Ask to reset the score')}</button>${G && (G.phase === 'bid' || G.phase === 'play') ? `<button class="btn" id="nNdQ">${T('Ask for a new deal')}</button>` : ''}`;
    return `<div class="grp"><span>${T('Table score')}</span><div>${line}</div><div class="row2">${btns}</div></div>`;
  }
  // the host answers a guest's request (a new deal during play, or a fresh score)
  function askAnswer(id, ok) {
    const a = st.asks && st.asks[id]; if (!a) return; delete st.asks[id];
    const who = st.names[a.seat] || SEAT[a.seat], c = st.conns.get(id);
    if (!ok) { try { c && c.send({ t: 'askno' }); } catch (e) {} panelRefresh(); render(); return; }
    if (a.kind === 'rs') { st.score = { ns: 0, ew: 0, n: 0 }; addChat(null, 'The table score was reset (asked by ' + who + ')'); broadcast(); }
    else { addChat(null, 'New deal (asked by ' + who + ')'); newBoard(); }
    panelRefresh(); render();
  }
  function resetScore() { if (!st.host) return; st.score = { ns: 0, ew: 0, n: 0 }; addChat(null, 'The table score was reset'); broadcast(); panelRefresh(); render(); }
  function askNewDeal() { send({ t: 'ndreq' }); flash(T('Asked the host for a new deal'), 2000); }

  /* ---- screens ---- */
  // players asking to join this table, each with Accept / Decline
  function pendHtml() {
    const pend = Object.entries(st.pending || {}), mv = Object.entries(st.moves || {});
    const moves = mv.length ? `<div class="grp"><span>${T('Asking to change seats')}</span>${mv.map(([id, m]) => `<div class="helprow"><span><b>${esc(st.names[m.from] || SEAT[m.from])}</b> ${SEAT[m.from]} → ${SEAT[m.to]}</span><span><button class="btn gold" data-mva="${esc(id)}">${T('Accept')}</button> <button class="btn" data-mvd="${esc(id)}">${T('Decline')}</button></span></div>`).join('')}</div>` : '';
    const join = pend.length ? `<div class="grp"><span>${T('Asking to join')}</span>${pend.map(([id, p]) => `<div class="helprow"><span><b>${esc(String(p.d.name || 'Guest').slice(0, 20))}</b> ${p.d.want === 'opp' ? T('(opponent)') : p.d.want === 'watch' ? '👁 ' + T('Watch') : p.d.want === 'any' ? '' : T('(partner)')}</span><span><button class="btn gold" data-accept="${esc(id)}">${T('Accept')}</button> <button class="btn" data-decline="${esc(id)}">${T('Decline')}</button></span></div>`).join('')}</div>` : '';

  function panel() {

  }

  document.addEventListener('click', ev => {
    const t = ev.target.closest('button'); if (!t) return;
    if (t.dataset.q) { sendChat(t.dataset.q); return; }
    if (t.dataset.kick != null) { kick(+t.dataset.kick); return; }

    if (t.dataset.mva) { moveAnswer(t.dataset.mva, true); return; }

      case 'nNdQ': askNewDeal(); closeOv(); break;
      case 'nCopy': { const L = link(); (navigator.clipboard ? navigator.clipboard.writeText(L) : Promise.reject()).then(() => flash('Link copied', 1200)).catch(() => { const i = document.getElementById('nLink'); if (i) { i.select(); } }); break; }
      case 'nJoin': { const n = document.getElementById('nName'); const name = (n && n.value.trim()) || 'Guest'; st.msg = ''; join(st.joinCode, name, st.want); break; }

  document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target && ev.target.id === "nMsg") { ev.preventDefault(); const i = ev.target; if (i.value.trim()) { sendChat(i.value); st.draft = ""; i.value = ""; } } });
  // opened through an invite link
  function boot() {
    const m = location.hash.match(/^#join-([A-Za-z0-9-]{4,10})$/i);
    // a new invite while sitting at another table: leave that one cleanly first (stops any reconnect attempts)
    if (m && st.guest) leave();
    if (m) { history.replaceState(null, '', location.pathname); st.savedG = null; setTimeout(() => showJoin(m[1]), 300); }
  }
  boot();
  setTimeout(autoRejoin, 700);
  window.addEventListener('hashchange', boot);
  // take a room so this table shows up in the lobby, and look at the other tables
  setTimeout(() => { claimSlot().then(() => { if (!st.tables) findTables(); }); }, 800);
  window.addEventListener('online', () => claimSlot());
  // keep this table listed (take an address again if it was lost) and keep the lobby list fresh
  function keepSlot() {
    if (!navigator.onLine) return;
    if (!st.slot) claimSlot();
    else if (st.slot.peer.disconnected && !st.slot.peer.destroyed) { try { st.slot.peer.reconnect(); } catch (e) {} }
  }
  const lobbyOpen = () => document.visibilityState === 'visible' && !st.guest && ((G && G.phase === 'idle') || ui.overlay === 'net');

  setInterval(() => { keepSlot(); if (!st.finding && (lobbyOpen() || (document.visibilityState === 'visible' && lobbyCount() <= 1 && st.slot))) findTables(); }, 20000);

})();
