# A test notification to the administrator's phones (Actions → Test notification → Run workflow): the robots' Worker
# wakes every phone subscribed as the administrator's, which shows "New message from Test" even with the app closed.
# The run says how many phones it went to (0: no phone has subscribed yet — open BridgePlay with notifications allowed).
name: Test notification
on:
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The key, asked as the site asks (with its Origin)
        run: curl -s -i https://bridge-bots.bridgeplay.workers.dev/push/key -H 'Origin: https://servetsvm.github.io' | grep -iE '^HTTP|access-control-allow-origin|"key"' | cut -c1-120
      - name: Send
        run: |
          R=$(curl -s -X POST https://bridge-bots.bridgeplay.workers.dev/push/send -H 'Origin: https://servetsvm.github.io' -H 'Content-Type: application/json' -d '{"to":"admin","kind":"msg","n":"Test"}')
          echo "$R"
          echo "### Test notification: $R" >> "$GITHUB_STEP_SUMMARY"
