# The robots' Worker (.github/botchat) put on Cloudflare: by hand (Actions → Robots' Worker → Run workflow) or when its
# files change. The Cloudflare token is the repository secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables →
# Actions; the "Edit Cloudflare Workers" template is enough); it is never in the files. The first time it also makes what
# the account lacks: the workers.dev address, the KV namespace for the notifications' subscriptions and the notifications'
# key pair (VAPID_JWK, kept as a Worker secret; later runs keep it). The optional repository secrets REVIEW_KEY and
# GEMINI_KEY are given to the Worker as its secrets of the same names.
name: Robots' Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/botchat/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      REVIEW_KEY: ${{ secrets.REVIEW_KEY }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
    defaults:
      run:
        working-directory: .github/botchat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The account, its workers.dev address and the KV namespace
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add the repository secret CLOUDFLARE_API_TOKEN first"; exit 1; }
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          ACC=$(api https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id // empty')
          test -n "$ACC" || { echo "The token sees no account"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
          SUB=$(api "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            for name in bridgeplay bridgeplay-bots "bridgeplay-${ACC:0:6}"; do
              if api -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain" -d "{\"subdomain\":\"$name\"}" | jq -e '.success' >/dev/null; then SUB=$name; break; fi
            done
          fi
          test -n "$SUB" || { echo "Could not register a workers.dev address"; exit 1; }
          echo "WORKER_URL=https://bridge-bots.$SUB.workers.dev" >> "$GITHUB_ENV"
          KV=$(api "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title == "bridge-bots-push") | .id' | head -1)
          [ -n "$KV" ] || KV=$(api -X POST "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces" -d '{"title":"bridge-bots-push"}' | jq -r '.result.id // empty')
          test -n "$KV" || { echo "Could not make the KV namespace"; exit 1; }
          sed -i "s/__PUSH_KV_ID__/$KV/" wrangler.toml
          echo "workers.dev: $SUB · KV: $KV"
      - name: Put the Worker on Cloudflare
        run: npx --yes wrangler@4 deploy
      - name: Its secrets (the notifications' key pair once; REVIEW_KEY and GEMINI_KEY when the repository has them)
        run: |
          LIST=$(npx --yes wrangler@4 secret list)
          if echo "$LIST" | grep -q '"VAPID_JWK"'; then echo "VAPID_JWK kept"; else node vapid.mjs | npx --yes wrangler@4 secret put VAPID_JWK; fi
          [ -z "$REVIEW_KEY" ] || printf '%s' "$REVIEW_KEY" | npx --yes wrangler@4 secret put REVIEW_KEY
          [ -z "$GEMINI_KEY" ] || printf '%s' "$GEMINI_KEY" | npx --yes wrangler@4 secret put GEMINI_KEY
      - name: Check
        run: |
          sleep 10
          echo "The Worker: $WORKER_URL"
          echo "### The robots' Worker: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
          curl -s "$WORKER_URL/push/key" | tee -a "$GITHUB_STEP_SUMMARY" | grep -q '"key"'
