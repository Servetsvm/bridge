# The robots' Worker (.github/botchat) put on Cloudflare: by hand (Actions → Robots' Worker → Run workflow) or when its
# files change. The Cloudflare token is the repository secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables →
# Actions); it is never in the files. The first time, the key pair for notifications (VAPID_JWK) is made and kept as a
# Worker secret; later runs keep it (a new pair would make every phone turn notifications on again).
name: Robots' Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/botchat/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: .github/botchat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Is the token there?
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add the repository secret CLOUDFLARE_API_TOKEN first"; exit 1; }
      - name: Put the Worker on Cloudflare
        run: npx --yes wrangler@4 deploy
      - name: The notifications' key pair (once)
        run: |
          if npx --yes wrangler@4 secret list | grep -q '"VAPID_JWK"'; then echo "VAPID_JWK is already set: kept"; else node vapid.mjs | npx --yes wrangler@4 secret put VAPID_JWK; fi
      - name: Check
        run: curl -s https://bridge-bots.bridgetable.workers.dev/push/key | head -c 200
