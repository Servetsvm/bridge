# The robots' tables: every two hours the robots of each of the six tables (one per system, side by side) play the
# boards of the next hours (.github/robots/robots.js), each with its start time; the files go to the robots-data
# branch (one commit, replaced each time, so the history does not grow), which the page reads from
# raw.githubusercontent.com and shows card by card at each board's time.
name: Robot table
on:
  schedule:
    - cron: '17 */2 * * *'
    - cron: '47 1-23/2 * * *'   # GitHub often drops a scheduled run: a second chance every hour
  workflow_dispatch:
  # a change to the robots' program starts it at once
  push:
    branches: [main]
    paths: ['.github/robots/**', '.github/workflows/robots.yml']
permissions:
  contents: write
concurrency: robots
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        sys: [sayc, twoone, acol, sef, precision, polish, claude]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The table so far
        run: |
          mkdir -p out
          for f in live-${{ matrix.sys }}.json errors-${{ matrix.sys }}.json lessons.json; do curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/robots-data/$f?$(date +%s)" -o out/$f || rm -f out/$f; done
      - name: Play the next boards
        run: node .github/robots/robots.js out ${{ matrix.sys }}
      - uses: actions/upload-artifact@v4
        with:
          name: table-${{ matrix.sys }}
          path: out/
          retention-days: 1
  publish:
    needs: play
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the tables as they were (a table whose job failed keeps its boards), then the new ones
      - name: The tables so far
        run: |
          mkdir -p out
          for s in sayc twoone acol sef precision polish claude; do for f in live-$s.json errors-$s.json; do curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/robots-data/$f?$(date +%s)" -o out/$f || rm -f out/$f; done; done
          curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/robots-data/lessons.json?$(date +%s)" -o out/lessons.json || rm -f out/lessons.json
      - uses: actions/download-artifact@v4
        with:
          path: new
          pattern: table-*
          merge-multiple: true
      - name: The tables' new boards
        run: cp -f new/live-*.json new/errors-*.json out/ 2>/dev/null || true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/robots/README.md out/README.md   # what the files hold
          cd out
          git init -q
          git checkout -q -b robots-data
          git add *.json README.md
          git -c user.name="Servetsvm" -c user.email="39servet@gmail.com" commit -qm "Robot tables: $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" robots-data
