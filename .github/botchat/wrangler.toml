name = "bridge-bots"
main = "worker.js"
compatibility_date = "2026-11-01"

[ai]
binding = "AI"

[vars]
# the best Turkish of the free models tried (Nov 2026); "@cf/meta/llama-3.1-8b-instruct-fp8-fast" is cheaper (more answers a day) but weaker
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Gemini answers first when the Worker has the secret GEMINI_KEY (npx wrangler secret put GEMINI_KEY); the model it asks:
# (gemini-flash-latest took over 9 s an answer in Nov 2026, the lite one about 1 s)
GEMINI_MODEL = "gemini-flash-lite-latest"

# the phones' subscriptions for notifications while the app is closed (Workers KV). The id is filled in by the
# GitHub workflow (.github/workflows/botchat.yml), which makes the namespace the first time.
[[kv_namespaces]]
binding = "PUSH"
id = "__PUSH_KV_ID__"

# The robots' chats and the devices' error reports were kept in a D1 database on the first Cloudflare account (no longer
# reachable, Nov 2026). Without the binding the Worker answers as before and keeps no log; to keep one again, make a D1
# database (npx wrangler d1 create bridge-botchat; then schema.sql) and add:
# [[d1_databases]]
# binding = "DB"
# database_name = "bridge-botchat"
# database_id = "<its id>"
