name = "bridge-bots"
main = "worker.js"
compatibility_date = "2026-11-01"

[ai]
binding = "AI"

[vars]
# the best Turkish of the free models tried (Nov 2026); "@cf/meta/llama-3.1-8b-instruct-fp8-fast" is cheaper (more answers a day) but weaker
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Gemini answers first when the Worker has the secret GEMINI_KEY (npx wrangler secret put GEMINI_KEY); the model it asks:
# (gemini-flash-latest took over 9 s an answer in Nov 2026, the lite one about 1 s)
GEMINI_MODEL = "gemini-flash-lite-latest"

# the robots' chats (no player names, no cards), kept 90 days, for reviewing and improving the answers
[[d1_databases]]
binding = "DB"
database_name = "bridge-botchat"
database_id = "c2f75df4-949d-441d-b344-41509bc64da4"
